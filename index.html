  onShow() { if (this.pmap) this.pmap.invalidateSize(); }
  renderVals() {
    const SF = window.SF, s = this.state;
    const set = o => this.setState(Object.assign({ error: '', ok: '' }, o));
    const locs = SF.locs.map((l, i) => ({
      name: l.name, color: l.color || '#1565C0', active: i === SF.activeIdx,
      sub: [l.note, SF.distStr(l.lat, l.lng) || SF.fmtLL(l.lat, l.lng)].filter(Boolean).join(' · '),
      tags: (l.tags || []).map(t => SF.TAG_LABELS[t] || t),
      bg: '#FFFFFF', ring: i === SF.activeIdx ? '0 0 0 2px #1463FF' : 'none',
      select: () => SF.selectLoc(i),
      edit: () => { set({ edit: i, name: l.name, note: l.note || '', lat: l.lat, lng: l.lng, latStr: String(l.lat), lngStr: String(l.lng), selName: l.name, color: l.color || '#1565C0', tags: (l.tags || []).slice() }); if (this.pmap) { this.placePin(l.lat, l.lng); this.pmap.setView([l.lat, l.lng], 12); } const sc = document.querySelector('[data-screen="Location"] [style*="overflow-y"]'); if (sc) sc.scrollTo({ top: 260, behavior: 'smooth' }); },

    const colors = COLORS.map(h => ({ hex: h, on: h === s.color ? 'true' : 'false', border: h === s.color ? '#FFFFFF' : h, outer: h === s.color ? '#0B1F3A' : 'transparent', pick: () => { set({ color: h }); if (s.lat != null) setTimeout(() => this.placePin(s.lat, s.lng), 0); } }));
    const tagChips = SF.TAGS.map(t => { const on = s.tags.includes(t[0]); return { label: t[1], on: on ? 'true' : 'false', bg: on ? '#1463FF' : '#F3F7FC', fg: on ? '#FFFFFF' : '#3A4A61', pick: () => set({ tags: on ? s.tags.filter(x => x !== t[0]) : s.tags.concat([t[0]]) }) }; });
    const hasSel = s.lat != null && s.lng != null && !isNaN(s.lat) && !isNaN(s.lng);
    const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
    const save = () => {
      const name = s.name.trim();
      if (!name) return this.setState({ error: '포인트 이름을 입력해줘!' });
      if (!hasSel) return this.setState({ error: '위치를 선택해줘! (검색, GPS, 지도, 좌표 직접 입력)' });
      const loc = { name, lat: s.lat, lng: s.lng, color: s.color, note: s.note.trim(), tags: s.tags.slice() };
      if (s.edit >= 0) SF.updateLoc(s.edit, loc); else SF.addLoc(loc);

      this.setState(Object.assign({}, this.blank, { ok: (s.edit >= 0 ? '수정 완료 — ' : '저장 완료 — ') + name + ' 날씨 불러오는 중' }));
    };
    return {
      locs, locCount: String(SF.locs.length),
      formTitle: s.edit >= 0 ? '포인트 수정' : '새 포인트 추가', isEdit: s.edit >= 0, saveLabel: s.edit >= 0 ? '수정 저장' : '저장하기',
      q: s.q, onQ: e => { const v = e.target.value; this.setState({ q: v }); this.search(v); }, results, hasResults: results.length > 0, searching: s.searching,
      useGps: () => SF.requestGPS((g, err) => { if (g) this.setSel(g.lat, g.lng, '현재 GPS'); else this.setState({ error: err }); }),
      pickerOn: s.picker, pickerBg: s.picker ? '#1463FF' : '#E7F0FF', pickerFg: s.picker ? '#FFFFFF' : '#0B3FA8', togglePicker: () => set({ picker: !s.picker }),
      directOn: s.direct, directBg: s.direct ? '#1463FF' : '#E7F0FF', directFg: s.direct ? '#FFFFFF' : '#0B3FA8', toggleDirect: () => set({ direct: !s.direct }),
      latStr: s.latStr, lngStr: s.lngStr,
      onLat: e => { const v = e.target.value; set({ latStr: v, lat: num(v), selName: '직접 입력' }); },
      onLng: e => { const v = e.target.value; set({ lngStr: v, lng: num(v), selName: '직접 입력' }); },

      clearSel: () => { set({ lat: null, lng: null, latStr: '', lngStr: '', selName: '', q: '', results: [] }); if (this.pmark) { this.pmark.remove(); this.pmark = null; } },

      colors, tagChips, hasError: !!s.error, error: s.error, hasOk: !!s.ok, ok: s.ok, save,
      cancelEdit: () => { set(Object.assign({}, this.blank)); if (this.pmark) { this.pmark.remove(); this.pmark = null; } }
    };
  }
}
</script>

<script type="text/plain" id="js-Eging">

    const maxS = Math.max(1, CS[0].score);

    const c1 = isNight ? { n: 'Blue / Night', h: '#3366ff' } : isRough ? { n: 'Orange / Gold', h: '#ff8800' } : (sst != null && sst > 21) ? { n: 'Brown / Natural', h: '#885533' } : { n: 'Orange / Gold', h: '#ff8800' };

    const size1 = tr > 1.5 ? '3.5호' : tr < 0.8 ? '3.0호' : '3.5호', size2 = tr > 1.5 ? '4.0호' : '3.0호', wt = tr > 1.5 ? '20g' : tr < 0.8 ? '10–15g' : '15–18g';

    const opp = (wdDeg + 180) % 360;

    const windRec = { wi, wd, prot, avoid: wd + '향 노출 포인트 회피', recs: LOCS.filter(l => { if (!l.expose) return false; const diff = Math.abs(wdDeg - dirToDeg(l.expose)) % 360; return (diff > 180 ? 360 - diff : diff) > 90; }).map(l => ({ name: l.name, reason: l.expose + '향 · 바람 등뒤' })) };

    const PT = [
      { id: 'breakwall', name: '방파제 끝단', badge: '조류 강', depth: '4–10m', action: '슬로우 폴 → 바닥 터치 → 빠른 저크', technique: '캐스팅 방향: 조류 흐름 대각선 30–45°. 에기가 흘러내려갈 때 라인 텐션 유지.', size: '3.5–4.0호 20g+', tip: '방파제 끝단은 조류가 꺾이는 지점에서 오징어가 먹이 사냥해. 만조 직전 조류 강해질 때 집중. 라인이 옆으로 흘러가면 히트 타이밍.' },
      { id: 'reef', name: '암초 엣지', badge: '수온 민감', depth: '3–8m', action: '바닥 드래그 → 롱 폴 5–8초 → 저크', technique: '암초 상단 edge 라인을 따라 캐스팅. 에기가 암초에 닿기 직전 감각 집중.', size: '3.0–3.5호 15–18g', tip: '암초 엣지는 오징어 은신처. 폴 중에 라인이 갑자기 멈추거나 흔들리면 즉시 챔질. 수온 16–22°C 구간이 핵심.' },
      { id: 'sandy', name: '모래밭 경계', badge: '야간 추천', depth: '2–6m', action: '롱 캐스팅 → 슬로우 리트리브 → 짧은 저크', technique: '해조류·모래 경계선 따라 평행 캐스팅. 야간에는 조명이 있는 곳 섀도우 라인.', size: '3.0–3.5호 10–15g', tip: '모래밭 경계는 야간 에깅 최고 포인트야. 오징어가 모래밭에서 먹이 사냥하다 해조류로 숨어. 느린 리트리브로 라인 경계를 훑어.' },
      { id: 'pier', name: '부두·피어', badge: '야간 조명', depth: '2–5m', action: '버티컬 지깅 → 수직 폴 → 정지', technique: '조명 아래 섀도우 라인. 빛과 어둠의 경계 2–3m 지점을 집중 공략.', size: '2.5–3.0호 10–15g', tip: '피어 조명은 플랑크톤 → 소형어 → 오징어 순으로 먹이사슬 형성. 조명 바로 아래보단 경계 지점이 진짜야. 조용히 접근하는 것도 중요.' }
    ];
    let recId = 'breakwall';
    if (isNight) recId = 'pier'; else if (sw < 1.5 && sst != null && sst > 19) recId = 'sandy'; else if (sw >= 1.5) recId = 'reef';
    const openId = s.open === null ? recId : s.open;
    const ptypes = PT.map((p, i) => {
      const op = p.id === openId, rec = p.id === recId;
      return Object.assign({}, p, { n: String(i + 1), rec, open: op, openStr: op ? 'true' : 'false', ring: rec ? '0 0 0 2px #1463FF' : 'none', iconBg: rec ? '#1463FF' : '#E7F0FF', iconFg: rec ? '#FFFFFF' : '#1463FF', toggle: () => this.setState({ open: op ? '' : p.id }) });
    });

    // 에기 계산기 (원본 calcEgi 로직)
    const EGI = { '3.0': { normal: { weight: 15.5, sinkRate: 3.75, label: '베이직(노멀)', note: '가을 본시즌 주력' }, shallow: { weight: 14.8, sinkRate: 6.0, label: '쉘로우', note: '조류 약할 때' }, super_shallow: { weight: 14.0, sinkRate: 8.0, label: '슈퍼쉘로우', note: '매우 얕은 수심' } }, '3.5': { normal: { weight: 21.0, sinkRate: 3.0, label: '베이직(노멀)', note: '봄 산란 / 비거리' }, shallow: { weight: 19.8, sinkRate: 5.75, label: '쉘로우', note: '조류 약한 낮' }, super_shallow: { weight: 19.0, sinkRate: 8.0, label: '슈퍼쉘로우', note: '표층 얕은 포인트' } } };
    const dp = s.depth, cu = s.current, tm = s.time, we = s.weather, wk = s.wind;
    const size = (dp > 10 || cu === 'strong' || wk > 30) ? '3.5' : '3.0';
    let type;
    if (cu === 'strong' || wk > 25) type = 'normal'; else if (cu === 'weak' && wk < 10) type = 'super_shallow'; else type = dp <= 4 ? 'shallow' : 'normal';
    let windNote = '';
    if (wk > 30) windNote = '바람 ' + wk + 'km/h — 무거운 쪽(' + size + '호 노멀) 선택으로 비거리 확보'; else if (wk > 20) windNote = '바람 ' + wk + 'km/h — 라인 슬랙 최소화, 팽팽한 텐션 유지'; else if (wk < 10) windNote = '바람 잔잔 — 경량 에기로 자연스러운 폴 연출 가능';
    const e = EGI[size][type];
    let color = 'Orange / Gold', colorHex = '#ff8800';
    if (tm === 'night') { color = 'Blue / Night UV'; colorHex = '#3366ff'; } else if (tm === 'dusk') { color = 'Pink / UV'; colorHex = '#ff44cc'; } else if (we === 'clear') { color = 'Brown / Natural'; colorHex = '#885533'; }
    let action, actionNote;
    if (cu === 'strong') { action = '빠른 폴 → 샤프 2단 저크'; actionNote = '조류에 에기 흘려보내며 바닥 집중'; } else if (cu === 'weak') { action = '롱 폴 → 긴 정지 (5–8초)'; actionNote = '슈퍼쉘로우로 표층 어필 최대화'; } else { action = '슬로우 폴 → 2–3 저크 → 정지 (3–5초)'; actionNote = '폴 중 라인 텐션 유지, 바이트 대기'; }
    const egi = { size, weight: String(e.weight), sink: String(e.sinkRate), label: e.label, note: e.note, depth: String(dp), fall: (dp * e.sinkRate).toFixed(0), color, colorHex, action, actionNote, summary: '수심 ' + dp + 'm · ' + (tm === 'night' ? '야간' : tm === 'dusk' ? '황혼' : '낮') + ' · ' + (cu === 'strong' ? '강한 조류' : cu === 'weak' ? '약한 조류' : '보통 조류'), hasWind: !!windNote, windNote };
    const steppers = [
      { lbl: '수심 (m)', val: String(dp), dn: () => this.setState({ depth: Math.max(1, dp - 1), filled: false }), up: () => this.setState({ depth: Math.min(30, dp + 1), filled: false }) },
      { lbl: '바람 (km/h)', val: String(wk), dn: () => this.setState({ wind: Math.max(0, wk - 5), filled: false }), up: () => this.setState({ wind: Math.min(80, wk + 5), filled: false }) }
    ];
    const pill = (key, val, opts) => opts.map(o => ({ label: o[1], on: val === o[0] ? 'true' : 'false', bg: val === o[0] ? '#1463FF' : '#F3F7FC', fg: val === o[0] ? '#FFFFFF' : '#0B1F3A', pick: () => this.setState({ [key]: o[0], filled: false }) }));
    const pillGroups = [
      { lbl: '조류', opts: pill('current', cu, [['weak', '약'], ['normal', '보통'], ['strong', '강']]) },
      { lbl: '시간대', opts: pill('time', tm, [['day', '낮'], ['dusk', '황혼'], ['night', '야간']]) },
      { lbl: '날씨', opts: pill('weather', we, [['clear', '맑음'], ['cloudy', '흐림'], ['rough', '비/강풍']]) }
    ];
    const autoFill = () => this.setState({ depth: tr > 1.5 ? 8 : tr < 0.8 ? 4 : 6, current: tr > 1.5 ? 'strong' : tr < 0.8 ? 'weak' : 'normal', time: (h >= 18 || h < 6) ? 'night' : (h >= 16 || h < 8) ? 'dusk' : 'day', weather: rain > 40 ? 'rough' : rain > 15 ? 'cloudy' : 'clear', wind: wi, filled: true });

    const sizes = [['2.5호', '1–8m', '맑은 물, 소형', '#ff69b4', '핑크/오렌지'], ['3.0호', '5–12m', '범용, 기본', '#ff8c00', '오렌지/금'], ['3.5호', '8–18m', '탁한 물, 대형', '#8b0000', '레드/브라운'], ['4.0호', '15m+', '야간, 깊은 수심', '#1a1a2e', '다크/야광']].map(z => ({ s: z[0], d: z[1], u: z[2], c: z[3], cn: z[4] }));
    const colorGuide = [['맑은 물', '핑크 · 오렌지 · 레몬', '#ff69b4', '#ff8c00'], ['탁한 물 / 흐린 날', '레드 · 브라운 · 자주', '#8b4513', '#654321'], ['야간', '화이트 · 야광 · 시스루', '#ffffff', '#00ffff']].map(c => ({ t: c[0], d: c[1], a: c[2], b: c[3] }));
    const tech = [['1', '캐스팅', '최대한 멀리 캐스트 → 에기 착저까지 카운트다운', '#1463FF'], ['2', '팁 런', '로드 팁을 빠르게 ×2–3 저킹 → 장선으로 승강', '#3D7BFF'], ['3', '폴', '에기가 천천히 가라앉는 동안 입질 집중 — 대부분 폴 중 hit', '#0B3FA8'], ['4', '텐션 폴', '라인을 팽팽하게 유지하며 폴 — 입질 감도 향상', '#2A55C7'], ['5', '훅셋', '로드를 빠르게 올려치기 (스윕) — 두 번은 금물', '#0B1F3A']].map(k => ({ n: k[0], t: k[1], d: k[2], c: k[3] }));
    const targets = [
      { name: 'Southern Calamari', peak: 'Apr–Jun', bag: '30', habitat: 'Seagrass beds, jetties', technique: 'Slow jigging at dawn/dusk, 2.5–3.5 size egi, 5–15m water depth. Match egi color to water clarity.' },
      { name: 'Arrow Squid', peak: 'Winter', bag: '30', habitat: 'Open water, reefs', technique: 'Fast retrieve, EGI at 10–25m. Work rocky reef edges. Use pink/orange in clear water, dark in dirty water.' },
      { name: 'Giant Cuttlefish', peak: 'Jul', bag: '20', habitat: 'Sandy reef edges', technique: 'Slow presentation near sandy/rocky interface. Watch for flashing color change — strike immediately.' }
    ];

    return {
      notice: SF.notice(), hasData, noData: !hasData, compareOk: LOCS.length >= 2, compareNo: LOCS.length < 2, windNoRecs: windRec.recs.length === 0, dayLabel: hasData ? (SF.marineDay === 0 ? '오늘' : t.dow + ' ' + t.dayNum + '일') + ' 조건 기반 실시간 에깅 전략 · ' + SF.locName() : '포인트를 추가하면 실시간 에깅 전략이 표시돼',
      tabs, isLive: s.tab === 'live' && hasData, isLiveTab: s.tab === 'live', isCalc: s.tab === 'calc', isGuide: s.tab === 'guide',

      sizes, colorGuide, tech, targets
    };
  }
}

<script type="text/plain" id="js-Log">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { form: false, f: this.blank(), error: '', filter: '전체', share: false, tmpl: 'jigging', copied: false };
  }
  blank() {
    const d = new Date(), iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const SF = window.SF, md = SF.today(), loc = SF.activeLoc();
    return { date: iso, spot: loc ? loc.name : '', fish: 'Drummer', size: '', weight: '', count: '', lure: '', swell: md ? md.swellH + 'm' : '', result: 'good', note: '', tags: [] };
  }
  renderVals() {
    const SF = window.SF, s = this.state, f = s.f;
    const FISH = ['Drummer', 'Snapper', 'Kingfish', 'Bream', 'Flathead', 'Tailor', 'Trevally', 'Mulloway', 'Luderick', 'Squid', 'Longtail Tuna', 'Salmon'];
    const EMOJI = { Drummer: '⚫', Snapper: '🔴', Kingfish: '👑', Bream: '⚪', Flathead: '🟤', Tailor: '⚡', Trevally: '💛', Mulloway: '🌙', Luderick: '🎣', Squid: '🦑', 'Longtail Tuna': '🔵', Salmon: '🐟' };
    const RES = { great: { label: '대박', bg: '#0B3FA8', fg: '#FFFFFF' }, good: { label: '좋음', bg: '#1463FF', fg: '#FFFFFF' }, ok: { label: '평범', bg: '#CFE1FF', fg: '#0B1F3A' }, bad: { label: '꽝', bg: '#E3EAF4', fg: '#3A4A61' } };
    const NONE = { label: '기록', bg: '#F3F7FC', fg: '#3A4A61' };
    const setF = (k, v) => this.setState({ f: Object.assign({}, s.f, { [k]: v }), error: '' });
    const on = {}; ['date', 'spot', 'size', 'weight', 'count', 'lure', 'swell', 'note'].forEach(k => on[k] = e => setF(k, e.target.value));
    const md = SF.today(), D = SF.sol.days(1)[0], blended = SF.blend(D.s, md).score;
    const pop = md ? SF.popScore(md).score : null;

    const logs = SF.logs;
    let fishTotal = 0, max = 0, maxFish = '—';
    logs.forEach(l => { fishTotal += parseInt(l.count || 1, 10) || 1; const z = parseFloat(l.size) || 0; if (z > max) { max = z; maxFish = l.fish; } });
    const stats = { trips: String(logs.length), fish: String(fishTotal), max: max ? String(max) : '—', maxFish, results: ['great', 'good', 'ok', 'bad'].map(k => ({ lbl: RES[k].label, n: String(logs.filter(l => l.result === k).length) })) };

    const fishOpts = FISH.map(x => ({ label: x, on: f.fish === x ? 'true' : 'false', bg: f.fish === x ? '#1463FF' : '#F3F7FC', fg: f.fish === x ? '#FFFFFF' : '#0B1F3A', pick: () => setF('fish', x) }));
    const resultOpts = ['great', 'good', 'ok', 'bad'].map(k => ({ label: RES[k].label, on: f.result === k ? 'true' : 'false', bg: f.result === k ? RES[k].bg : '#F3F7FC', fg: f.result === k ? RES[k].fg : '#0B1F3A', pick: () => setF('result', k) }));
    const tagOpts = SF.TAGS.map(tg => { const o = f.tags.includes(tg[0]); return { label: tg[1], on: o ? 'true' : 'false', bg: o ? '#0B1F3A' : '#F3F7FC', fg: o ? '#FFFFFF' : '#3A4A61', pick: () => setF('tags', o ? f.tags.filter(x => x !== tg[0]) : f.tags.concat([tg[0]])) }; });
    const save = () => {
      if (!f.date) return this.setState({ error: '날짜를 입력해줘!' });
      if (!f.spot.trim()) return this.setState({ error: '포인트를 입력해줘!' });
      SF.addLog(Object.assign({}, f, { spot: f.spot.trim(), count: f.count || '1', emoji: EMOJI[f.fish] || '🐟', score: blended, ts: Date.now() }));
      this.setState({ f: this.blank(), form: false, error: '', filter: '전체' });
    };

    const present = ['전체'].concat(FISH.filter(x => logs.some(l => l.fish === x)));
    const chips = present.map(l => ({ label: l, on: l === s.filter ? 'true' : 'false', bg: l === s.filter ? '#0B1F3A' : '#FFFFFF', fg: l === s.filter ? '#FFFFFF' : '#0B1F3A', pick: () => this.setState({ filter: l }) }));
    const order = logs.map((l, idx) => ({ l, idx })).sort((a, b) => (String(b.l.date) + (b.l.ts || 0)).localeCompare(String(a.l.date) + (a.l.ts || 0)) || b.idx - a.idx);
    const entries = order.filter(x => s.filter === '전체' || x.l.fish === s.filter).slice(0, 60).map((x, i) => {
      const l = x.l, R = RES[l.result] || NONE;
      const d = /^(\d{4})-(\d{2})-(\d{2})/.exec(l.date || ''), ds = d ? (+d[2]) + '월 ' + (+d[3]) + '일' : (l.date || '—');
      const prevBest = logs.some((y, j) => y !== l && y.spot === l.spot && y.result === 'great' && String(y.date) < String(l.date));
      const chipsE = []; if (l.lure) chipsE.push(l.lure); if (l.weight) chipsE.push(l.weight + 'kg'); if (l.swell) chipsE.push('스웰 ' + l.swell);
      (l.tags || []).forEach(tg => { if (SF.TAG_LABELS[tg] && SF.TAG_LABELS[tg] !== l.fish) chipsE.push('#' + SF.TAG_LABELS[tg]); });
      return {
        fishName: l.fish || 'Unknown', size: l.size || '—', sizeUnit: l.size ? 'cm' : '', spot: l.spot || '—',
        meta: (l.spot || '—') + ' · ' + ds + ' · ' + (l.count || 1) + '마리', chips: chipsE,
        resLabel: R.label, resBg: R.bg, resFg: R.fg, prevBest, score: l.score != null ? String(l.score) : '—',
        hasNote: !!l.note, note: l.note, squid: l.fish === 'Squid', fish: l.fish !== 'Squid',
        tint: l.result === 'great' ? '#1463FF' : '#E7F0FF', color: l.result === 'great' ? '#FFFFFF' : '#1463FF',
        delay: (0.04 * Math.min(i, 8)).toFixed(2) + 's', del: () => { if (confirm('이 기록을 삭제할까?')) SF.deleteLog(x.idx); }
      };
    });

    // 공유 텍스트 (v7 genShareText V4.1 — 실제 데이터)
    const now = new Date(), dateStr = (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + SF.DOW[now.getDay()] + ')';
    const EM = { jigging: '⚡', popping: '🌊', eging: '🦑', rock: '🪨' }, LB = { jigging: '지깅 세션', popping: '파핑 세션', eging: '에깅 세션', rock: '갯바위 세션' };
    const t = SF.day(), tr = SF.trOf(t);
    const lines = [EM[s.tmpl] + " Scott's Marine — " + LB[s.tmpl], '📅 ' + dateStr + ' · 📍 ' + SF.locName(), ''];
    if (t) {
      lines.push('🌊 스웰: ' + t.swellH + 'm ' + t.swellD + ' · 주기 ' + (t.swellPer || '—') + 's', '💨 바람: ' + t.windKmh + 'km/h ' + t.windD);
      if (t.sst != null) lines.push('🌡 수온: ' + t.sst + '°C');
      lines.push('📊 기압: ' + t.pressure + 'hPa');
      const nh = t.tides.find(x => x.type === 'high'), nl = t.tides.find(x => x.type === 'low');
      if (nh) lines.push('↑ 만조: ' + SF.f2(nh.h, nh.m) + ' (' + nh.height + 'm)');
      if (nl) lines.push('↓ 간조: ' + SF.f2(nl.h, nl.m) + ' (' + nl.height + 'm)');
    }
    lines.push('');
    if (s.tmpl === 'jigging') lines.push('⚡ 지깅 세팅:', '   조차 ' + tr.toFixed(1) + 'm · ' + (tr > 1.5 ? '슬로우지그 무거운 쪽' : tr < 0.8 ? '라이트 지그' : '표준 무게'), '   타겟: Kingfish / Snapper');
    else if (s.tmpl === 'popping') lines.push('🌊 파핑 세팅:', '   포퍼 ' + (t && t.swellH >= 1.2 ? '140–180mm' : '120–150mm') + ' 헤비', '   조류 타는 암초 엣지 집중');
    else if (s.tmpl === 'eging') { lines.push('🦑 에깅 세팅:', '   에기 3.5호 · 조차 ' + tr.toFixed(1) + 'm'); if (t && t.sst) lines.push('   수온 ' + t.sst + '°C · 오징어 활성 ' + (t.sst >= 17 && t.sst <= 22 ? '최고' : '보통')); }
    else lines.push('🪨 갯바위 세팅:', '   Cunjevoi / Cabbage weed', '   만조 전후 2시간 집중');

<script type="text/plain" id="js-Tools">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'jig', depth: 60, current: 'normal', type: 'slow', target: 'kingfish' };
  }
  renderVals() {
    const s = this.state;
    const sel = (on) => ({ bg: on ? '#1463FF' : '#F3F7FC', fg: on ? '#FFFFFF' : '#0B1F3A', on: on ? 'true' : 'false' });
    const modes = [['jig', '지그 계산기'], ['pop', '포핑 스코어']].map(m => ({
      label: m[1], on: s.mode === m[0] ? 'true' : 'false',
      bg: s.mode === m[0] ? '#FFFFFF' : 'transparent', fg: s.mode === m[0] ? '#1463FF' : '#5B6B82',
      pick: () => this.setState({ mode: m[0] })
    }));
    const baseMul = { weak: 2.2, normal: 3.0, strong: 4.2, extreme: 5.5 };
    const typeMul = { slow: 0.85, speed: 1.0, super_slow: 0.7 };
    const bonus = { kingfish: 10, snapper: 0, tuna: 15, general: 0 };
    const typeLabels = { slow: '슬로우 피치 지그', speed: '스피드 지그', super_slow: '슈퍼슬로우 지그' };
    let base = Math.round((s.depth * baseMul[s.current] * typeMul[s.type] + bonus[s.target]) / 10) * 10;
    const min = Math.max(40, base - 20);
    const max = base + 30;
    const scale = 1200;
    const currentLabels = { weak: '약한 조류', normal: '보통 조류', strong: '강한 조류', extreme: '매우 강한 조류' };
    const peRec = s.depth > 80 ? 'PE 3–4' : s.depth > 50 ? 'PE 2.5–3' : 'PE 2–2.5';
    const leaderRec = s.target === 'kingfish' ? '80–100lb Fluoro' : s.target === 'tuna' ? '60–80lb Fluoro' : '40–60lb Fluoro';
    const hookRec = s.type === 'slow' ? 'Assist hook 더블 세팅' : s.type === 'super_slow' ? 'Assist 롱샹크 싱글' : 'Assist hook 트윈';
    const actionRec = s.type === 'slow' ? '슬로우폴 → 와인딩 1–2회 → 정지' : s.type === 'super_slow' ? '바닥 터치 → 초슬로우 폴 → 라인 텐션만 유지' : '고속 와인딩 → 폴 → 고속 반복';
    const jig = {
      setup: [{ lbl: 'PE 라인', val: peRec }, { lbl: '리더', val: leaderRec }, { lbl: '훅 세팅', val: hookRec }, { lbl: '액션', val: actionRec }],
      currentLabel: currentLabels[s.current],
      base: String(base), min: String(min), max: String(max), typeLabel: typeLabels[s.type],
      rangeL: Math.min(90, (min / scale) * 100).toFixed(1) + '%',
      rangeW: Math.max(6, ((max - min) / scale) * 100).toFixed(1) + '%',
      top: Math.round(10 + (s.depth / 200) * 112) + 'px',
      line: Math.round(14 + (s.depth / 200) * 112) + 'px'
    };
    const currents = [['weak', '약'], ['normal', '보통'], ['strong', '강'], ['extreme', '급류']].map(c => ({ label: c[1], ...sel(s.current === c[0]), pick: () => this.setState({ current: c[0] }) }));
    const types = [['slow', '슬로우'], ['speed', '스피드'], ['super_slow', '슈퍼슬로우']].map(c => ({ label: c[1], ...sel(s.type === c[0]), pick: () => this.setState({ type: c[0] }) }));
    const targets = [['kingfish', '킹피쉬'], ['snapper', '스내퍼'], ['tuna', '참치'], ['general', '일반']].map(c => ({ label: c[1], ...sel(s.target === c[0]), pick: () => this.setState({ target: c[0] }) }));
    const colorRecs = {
      kingfish: [{ c: '#ff9ecd', n: 'Pink/White', w: '메인' }, { c: '#ccddee', n: 'Silver/Blue', w: '맑은날' }, { c: '#aadd00', n: 'Chartreuse', w: '탁한물' }],
      snapper: [{ c: '#ff4488', n: 'Red/Pink', w: '메인' }, { c: '#ff8800', n: 'Orange', w: '흐린날' }, { c: '#ffffff', n: 'White/Pearl', w: '맑은날' }],
      tuna: [{ c: '#60b8ff', n: 'Blue/Silver', w: '메인' }, { c: '#ff9ecd', n: 'Pink', w: '보일 시' }, { c: '#c6ff00', n: 'Chartreuse', w: '녹조류' }],

    };
    // 원본 renderPoppingScore 로직 (오늘 조건 — WillyWeather 연동 자리, 샘플)
    const SF = window.SF, md = SF.day(), hasData = !!md;
    const pt = md ? { sw: md.swellH, wi: md.windKmh, wd: md.windD, sst: md.sst, rain: md.rain || 0, pres: md.pressure || 1013, tr: SF.trOf(md) } : { sw: 1.0, wi: 10, wd: '—', sst: null, rain: 0, pres: 1013, tr: 1.0 };
    const parts = [];
    let pS = 0; if (pt.sw >= 0.8 && pt.sw <= 1.5) pS = 25; else if (pt.sw >= 1.5 && pt.sw <= 2.0) pS = 15; else if (pt.sw > 2.5) pS = -25; else if (pt.sw < 0.5) pS = -10; parts.push(['스웰', pt.sw + 'm', pS]);
    let pW = 0; if (pt.wi >= 10 && pt.wi <= 25) pW = 20; else if (pt.wi > 35) pW = -20; else if (pt.wi < 5) pW = -5; parts.push(['바람', pt.wi + 'km/h', pW]);
    let pT = 0; if (pt.sst != null) { if (pt.sst >= 21 && pt.sst <= 27) pT = 15; else if (pt.sst < 19) pT = -10; } parts.push(['수온', pt.sst != null ? pt.sst + '°C' : '—', pT]);

    let pN = 0; if (pt.rain > 50) pN = -12; parts.push(['강수', pt.rain + '%', pN]);
    const popScore = Math.max(5, Math.min(99, 50 + parts.reduce((a, x) => a + x[2], 0)));
    const factors = parts.map((x, i) => ({ name: x[0], val: x[1], pts: (x[2] > 0 ? '+' : '') + x[2], ptsCol: x[2] > 0 ? '#1463FF' : x[2] < 0 ? '#C2410C' : '#5B6B82', w: Math.round(Math.abs(x[2]) / 25 * 100) + '%', bg: x[2] >= 0 ? '#1463FF' : '#F2A97E', delay: (0.2 + 0.08 * i).toFixed(2) + 's' }));
    const windFav = ['SW', 'WSW', 'W', 'WNW', 'NW'].includes(pt.wd);
    const tips = [{ t: '파핑 핵심: 파도 있는 날 암초 주변 조류 타는 지점에서 포퍼를 거칠게 쳐줘.', c: '#1463FF' }];
    if (pt.sw < 0.5) tips.push({ t: '너무 잔잔한 날 — 포퍼보단 스틱베이트나 지깅으로 전환 추천.', c: '#C2410C' });
    if (pt.sw > 2.0) tips.push({ t: '파도 강함 — 안전한 포인트 또는 만 안쪽 집중.', c: '#C2410C' });
    tips.push(windFav ? { t: '등바람 조건 — 롱캐스팅 유리, 비거리 극대화.', c: '#13703F' } : { t: '맞바람 주의 — 캐스팅 각도 조정 필요.', c: '#B7791F' });
    const pop = {
      label: popScore >= 80 ? '파핑 최상 조건!' : popScore >= 60 ? '파핑 좋은 날' : popScore >= 40 ? '파핑 가능' : '파핑 비추천',
      labelBg: popScore >= 80 ? '#0B3FA8' : popScore >= 60 ? '#1463FF' : popScore >= 40 ? '#3D7BFF' : '#C2410C',
      sw: pt.sw, wi: pt.wi, wd: pt.wd, sst: pt.sst != null ? pt.sst : '—', pres: pt.pres, tr: pt.tr.toFixed(1),
      windTxt: windFav ? '등 바람' : '마주 바람', windCol: windFav ? '#13703F' : '#C2410C',
      popper: pt.sw >= 1.2 ? '140–180mm (헤비)' : pt.sw >= 0.8 ? '120–150mm (미디엄)' : '100–130mm (라이트)',
      popperWt: pt.sw >= 1.2 ? '60–80g' : pt.sw >= 0.8 ? '40–60g' : '30–45g', tips
    };
    return {
      modes, isJig: s.mode === 'jig', isPop: s.mode === 'pop',
      depth: String(s.depth), jig, currents, types, targets, colors: colorRecs[s.target],
      depthUp: () => this.setState({ depth: Math.min(200, s.depth + 10) }),
      depthDown: () => this.setState({ depth: Math.max(10, s.depth - 10) }),
      popScore: String(popScore), popOffset: Math.round(327 - 327 * popScore / 100), factors, pop, locName: SF.locName(), notice: SF.notice(), isPopData: s.mode === 'pop' && hasData
    };
  }
}

  SF.TAGS = [['kingfish', 'Kingfish'], ['snapper', 'Snapper'], ['bream', 'Bream'], ['flathead', 'Flathead'], ['drummer', 'Drummer'], ['luderick', 'Luderick'], ['trevally', 'Trevally'], ['mulloway', 'Mulloway'], ['squid', '에깅'], ['longtail_tuna', 'Longtail'], ['aus_salmon', 'Salmon'], ['tailor', 'Tailor']];

  // ── GPS ──

    if (!navigator.geolocation) { if (cb) cb(null, 'GPS 미지원'); return; }

  };
  SF.distStr = (lat, lng) => {
    if (!SF.gps) return '';
    const d = SF.hav(SF.gps.lat, SF.gps.lng, lat, lng);
    return d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + ' km';
  };

  SF.locs = LS.get('nsw_locs', []);
  if (!Array.isArray(SF.locs)) SF.locs = [];

  const saveLocs = () => LS.set('nsw_locs', SF.locs);
  SF.selectLoc = i => { SF.activeIdx = i; LS.set('sf_active_idx', i); SF.marineDay = 0; SF.loadWeather(); SF.emit(); };
  SF.addLoc = loc => { SF.locs.push(loc); saveLocs(); SF.selectLoc(SF.locs.length - 1); };

  };

  SF.deletePin = i => { SF.pins.splice(i, 1); LS.set('nsw_fish_pins', SF.pins); SF.emit(); };

  // ── 조황 일지 (v7: FISH_LOG + V4.1 nsw_fish_log 1회 병합) ──
  let logs = LS.get('FISH_LOG', []);
  if (!Array.isArray(logs)) logs = [];
  if (!LS.get('sf_v8_migrated', false)) {
    const old = LS.get('nsw_fish_log', []);
    if (Array.isArray(old)) old.slice().reverse().forEach(o => logs.push({ date: o.date, spot: o.spot, fish: o.species || '', swell: o.swell || '', result: o.result || 'ok', note: o.note || '', count: '1', tags: [], ts: o.ts }));
    LS.set('FISH_LOG', logs); LS.set('sf_v8_migrated', true);
  }
  SF.logs = logs;
  SF.addLog = e => { SF.logs.push(e); LS.set('FISH_LOG', SF.logs); SF.emit(); };
  SF.deleteLog = i => { SF.logs.splice(i, 1); LS.set('FISH_LOG', SF.logs); SF.emit(); };

  // ── 솔루나 엔진 (v7 원본) ──
  const LUNAR_REF = Date.parse('2025-01-29T12:36:00Z'), CYC = 29.53058867;
  const sol = SF.sol = {};

    if (a < 1.85) return { n: '그믐달 (신월)', pct: 2 };

  const SP = [[0,96],[.05,83],[.08,60],[.12,27],[.15,15],[.18,15],[.25,69],[.32,15],[.35,15],[.38,27],[.42,60],[.45,83],[.5,96],[.55,83],[.58,60],[.62,27],[.65,15],[.68,15],[.75,69],[.82,15],[.85,15],[.88,27],[.92,60],[.95,83],[1,96]];

    app.appendChild(host);
    let pending = false;
    const render = () => {
      pending = false;
      let vals;
      try { vals = inst.renderVals(); } catch (e) { console.error('[' + name + ']', e); return; }
      const kids = [];
      tpl.content.childNodes.forEach(c => build(c, vals, kids));
      patchChildren(host, kids);
      if (inst.componentDidRender) { try { inst.componentDidRender(host); } catch (e) { console.error('[' + name + ']', e); } }
    };
    inst.__schedule = () => { if (!pending) { pending = true; Promise.resolve().then(render); } };
    screens[name] = { host, inst };
    render();
    if (inst.componentDidMount) inst.componentDidMount();
  }
  if (window.SF) window.SF.subscribe(() => { for (const k in screens) screens[k].inst.__schedule(); });
  const NAMES = ['Main', 'Solunar', 'Marine', 'Map', 'Location', 'Species', 'Eging', 'Log', 'Tools'];
  function show(name) {
    if (NAMES.indexOf(name) < 0) name = 'Main';
    if (!screens[name]) mount(name);
    for (const k in screens) screens[k].host.style.display = k === name ? '' : 'none';
    const sc = screens[name].host.firstElementChild && screens[name].host.querySelector('[style*="overflow-y"]');
    if (sc) sc.scrollTop = 0;
    const inst = screens[name].inst;
    if (inst.onShow) setTimeout(() => { try { inst.onShow(screens[name].host); } catch (e) { console.error(e); } }, 30);
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  if (window.SF) window.SF._show = show;
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const m = /^\/?([A-Za-z0-9_-]+)\.dc\.html$/.exec(a.getAttribute('href'));
    if (m) { e.preventDefault(); show(m[1]); }
  });
  show((location.hash || '#Main').slice(1));
  if (window.SF && window.SF.activeLoc()) window.SF.loadWeather();
  // v7 서비스워커/캐시 정리 (예전 화면이 캐시에서 뜨는 것 방지)
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then(ks => ks.filter(k => /^scotts-/.test(k)).forEach(k => caches.delete(k))).catch(() => {});
  } catch (e) {}
})();

</script>
