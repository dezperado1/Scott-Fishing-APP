<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1463FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Scott Fishing</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#DCE6F2;-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#F3F7FC;box-shadow:0 0 40px rgba(11,31,58,.12)}
.screen{position:absolute;inset:0}
a{color:#1463FF}a:hover{color:#0B3FA8}
button{-webkit-appearance:none;appearance:none}
.leaflet-container{font-family:'Plus Jakarta Sans','Noto Sans KR',sans-serif;background:#CFE6FF}
.leaflet-popup-content-wrapper{border-radius:14px}

/* ── Main ── */

.x0 *{box-sizing:border-box}
@keyframes x0Wave{from{transform:translateX(0)}to{transform:translateX(-390px)}}
@keyframes x0Fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes x0Ring{from{stroke-dashoffset:327}}
@keyframes x0Draw{from{stroke-dashoffset:900}}
@keyframes x0Pulse{0%{box-shadow:0 0 0 0 rgba(20,99,255,.55)}100%{box-shadow:0 0 0 12px rgba(20,99,255,0)}}
@keyframes x0Bubble{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
@keyframes x0Sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes x0Count{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes x0Spin{to{transform:rotate(360deg)}}
.x0-wave{animation:x0Wave 7s linear infinite}
.x0-wave2{animation:x0Wave 11s linear infinite reverse}
.x0-fu{animation:x0Fu .7s cubic-bezier(.2,.8,.2,1) both}
.x0-ring{animation:x0Ring 1.6s cubic-bezier(.3,.7,.2,1) .3s both}
.x0-draw{animation:x0Draw 2.2s ease-out .5s both}
.x0-pulse{animation:x0Pulse 1.6s ease-out infinite}
.x0-bubble{animation:x0Bubble 4s ease-in infinite}
.x0-sway{animation:x0Sway 3s ease-in-out infinite;transform-origin:50% 50%}
.x0-count{animation:x0Count .8s cubic-bezier(.2,1.4,.4,1) .6s both}
.x0-spin{animation:x0Spin 1s linear infinite}
.x0-tile{transition:transform .2s ease,box-shadow .2s ease}
.x0-tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,99,255,.14)}
@media (prefers-reduced-motion:reduce){.x0 *{animation:none !important;transition:none !important}}

/* ── Solunar ── */

.x1 *{box-sizing:border-box}
@keyframes x1Fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes x1Ring{from{stroke-dashoffset:528}}
@keyframes x1Grow{from{transform:scaleY(0)}}
@keyframes x1Glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}50%{filter:drop-shadow(0 0 16px rgba(255,255,255,.7))}}
@keyframes x1Float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes x1Twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes x1Pulse{0%{box-shadow:0 0 0 0 rgba(20,99,255,.55)}100%{box-shadow:0 0 0 10px rgba(20,99,255,0)}}
@keyframes x1Shine{0%,100%{box-shadow:0 0 0 0 rgba(20,99,255,0)}50%{box-shadow:0 0 0 6px rgba(20,99,255,.18)}}
.x1-fu{animation:x1Fu .6s cubic-bezier(.2,.8,.2,1) both}
.x1-ring{animation:x1Ring 1.6s cubic-bezier(.3,.7,.2,1) .2s both}
.x1-grow{animation:x1Grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
.x1-moon{animation:x1Glow 4s ease-in-out infinite,x1Float 6s ease-in-out infinite}
.x1-star{animation:x1Twinkle 2.4s ease-in-out infinite}
.x1-pulse{animation:x1Pulse 1.6s ease-out infinite}
.x1-shine{animation:x1Shine 2.5s ease-in-out infinite}
.x1-chip{transition:transform .15s ease,background .2s ease}
.x1-chip:active{transform:scale(.95)}
.x1-nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.x1 *{animation:none !important;transition:none !important}}

/* ── Marine ── */

.x2 *{box-sizing:border-box}
@keyframes x2Wave{from{transform:translateX(0)}to{transform:translateX(-390px)}}
@keyframes x2Fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes x2Grow{from{transform:scaleY(0)}}
@keyframes x2SpinIn{from{transform:rotate(0deg)}}
@keyframes x2Bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes x2Draw{from{stroke-dashoffset:1400}}
@keyframes x2Spin{to{transform:rotate(360deg)}}
.x2-wave{animation:x2Wave 6s linear infinite}
.x2-wave2{animation:x2Wave 9s linear infinite reverse}
.x2-wave3{animation:x2Wave 13s linear infinite}
.x2-fu{animation:x2Fu .6s cubic-bezier(.2,.8,.2,1) both}
.x2-grow{animation:x2Grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
.x2-needle{animation:x2SpinIn 1.4s cubic-bezier(.3,1.3,.5,1) .3s both}
.x2-bob{animation:x2Bob 2.6s ease-in-out infinite}
.x2-draw{animation:x2Draw 2s ease-out .2s both}
.x2-spin{animation:x2Spin 1s linear infinite}
.x2-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x2-chip:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.x2 *{animation:none !important;transition:none !important}}

/* ── Map ── */

.x3 *{box-sizing:border-box}
@keyframes x3Fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.x3-fu{animation:x3Fu .5s cubic-bezier(.2,.8,.2,1) both}
.x3-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x3-chip:active{transform:scale(.95)}
.x3 .leaflet-container{border-radius:26px}
@media (prefers-reduced-motion:reduce){.x3 *{animation:none !important;transition:none !important}}

/* ── Location ── */

.x4 *{box-sizing:border-box}
@keyframes x4Fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes x4Drop{0%{transform:translateY(-18px);opacity:0}60%{transform:translateY(2px);opacity:1}100%{transform:none}}
@keyframes x4Ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.x4-fu{animation:x4Fu .5s cubic-bezier(.2,.8,.2,1) both}
.x4-drop{animation:x4Drop .6s cubic-bezier(.3,1.3,.5,1) both}
.x4-ping{animation:x4Ping 1.6s ease-out infinite}
.x4-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x4-chip:active{transform:scale(.95)}
.x4 input{font:inherit}
.x4 input:focus{outline:2px solid #1463FF;outline-offset:1px}
@media (prefers-reduced-motion:reduce){.x4 *{animation:none !important;transition:none !important}}

/* ── Species ── */

.x5 *{box-sizing:border-box}
@keyframes x5Fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes x5Ring{from{stroke-dashoffset:107}}
@keyframes x5Bar{from{transform:scaleX(0)}}
@keyframes x5Swim{0%,100%{transform:translateX(0) rotate(0deg)}25%{transform:translateX(3px) rotate(-3deg)}75%{transform:translateX(-3px) rotate(3deg)}}
@keyframes x5Shine{0%,100%{box-shadow:0 0 0 0 rgba(20,99,255,0)}50%{box-shadow:0 0 0 5px rgba(20,99,255,.2)}}
.x5-fu{animation:x5Fu .5s cubic-bezier(.2,.8,.2,1) both}
.x5-ring{animation:x5Ring 1.2s cubic-bezier(.3,.7,.2,1) .1s both}
.x5-bar{animation:x5Bar .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
.x5-swim{animation:x5Swim 2.6s ease-in-out infinite}
.x5-shine{animation:x5Shine 2.4s ease-in-out infinite}
.x5-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x5-chip:active{transform:scale(.95)}
.x5 input{font:inherit}
.x5 input:focus{outline:2px solid #1463FF;outline-offset:1px}
.x5-nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.x5 *{animation:none !important;transition:none !important}}

/* ── Eging ── */

.x6 *{box-sizing:border-box}
@keyframes x6Fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes x6Bar{from{transform:scaleX(0)}}
@keyframes x6Squid{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes x6Ink{0%{transform:scale(.4);opacity:.5}100%{transform:scale(2.2);opacity:0}}
@keyframes x6Spin{from{transform:rotate(-60deg);opacity:0}}
@keyframes x6Fall{0%{transform:translateY(0)}100%{transform:translateY(90px)}}
@keyframes x6Shine{0%,100%{box-shadow:0 0 0 0 rgba(20,99,255,0)}50%{box-shadow:0 0 0 5px rgba(20,99,255,.2)}}
.x6-fu{animation:x6Fu .5s cubic-bezier(.2,.8,.2,1) both}
.x6-bar{animation:x6Bar 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
.x6-squid{animation:x6Squid 3s ease-in-out infinite}
.x6-ink{animation:x6Ink 3s ease-out infinite}
.x6-spin{animation:x6Spin 1.2s cubic-bezier(.3,1.3,.5,1) .3s both;transform-box:view-box;transform-origin:44px 44px}
.x6-fall{animation:x6Fall 2.8s ease-in infinite alternate}
.x6-shine{animation:x6Shine 2.4s ease-in-out infinite}
.x6-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x6-chip:active{transform:scale(.95)}
.x6-nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.x6 *{animation:none !important;transition:none !important}}

/* ── Log ── */

.x7 *{box-sizing:border-box}
@keyframes x7Fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes x7Pulse{0%{box-shadow:0 10px 24px rgba(20,99,255,.35),0 0 0 0 rgba(20,99,255,.5)}100%{box-shadow:0 10px 24px rgba(20,99,255,.35),0 0 0 16px rgba(20,99,255,0)}}
@keyframes x7Swim{0%{transform:translateX(-60px) scaleX(1)}49%{transform:translateX(330px) scaleX(1)}50%{transform:translateX(330px) scaleX(-1)}100%{transform:translateX(-60px) scaleX(-1)}}
@keyframes x7Sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes x7Fade{from{opacity:0}to{opacity:1}}
@keyframes x7Pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.x7-fu{animation:x7Fu .5s cubic-bezier(.2,.8,.2,1) both}
.x7-fab{animation:x7Pulse 1.8s ease-out infinite;transition:transform .25s ease}
.x7-swim{animation:x7Swim 14s linear infinite}
.x7-sheet{animation:x7Sheet .4s cubic-bezier(.2,.8,.2,1) both}
.x7-fade{animation:x7Fade .3s ease both}
.x7-pop{animation:x7Pop .45s cubic-bezier(.3,1.3,.5,1) both}
.x7-chip{transition:transform .15s ease,background .2s ease,color .2s ease}
.x7-chip:active{transform:scale(.95)}
.x7 input,.x7 textarea{font:inherit}
.x7 input:focus,.x7 textarea:focus{outline:2px solid #1463FF;outline-offset:1px}
.x7-nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.x7 *{animation:none !important;transition:none !important}}

/* ── Tools ── */

.x8 *{box-sizing:border-box}
@keyframes x8Fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes x8Drop{from{transform:translateY(-120px);opacity:0}}
@keyframes x8Flutter{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes x8Ring{from{stroke-dashoffset:327}}
@keyframes x8Bar{from{transform:scaleX(0)}}
@keyframes x8Rise{0%{transform:translateY(0);opacity:0}30%{opacity:.6}100%{transform:translateY(-160px);opacity:0}}
.x8-fu{animation:x8Fu .6s cubic-bezier(.2,.8,.2,1) both}
.x8-drop{animation:x8Drop 1.2s cubic-bezier(.3,1.2,.5,1) both}
.x8-flutter{animation:x8Flutter 1.6s ease-in-out infinite;transform-origin:50% 0}
.x8-ring{animation:x8Ring 1.6s cubic-bezier(.3,.7,.2,1) .2s both}
.x8-bar{animation:x8Bar 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 50%}
.x8-rise{animation:x8Rise 5s ease-in infinite}
.x8-pill{transition:background .2s ease,color .2s ease,transform .15s ease}
.x8-pill:active{transform:scale(.96)}
.x8-nav a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.x8 *{animation:none !important;transition:none !important}}

</style>
</head>
<body>
<div id="app"></div>
<noscript>JavaScript를 켜야 앱이 동작해.</noscript>

<template id="tpl-Main">
<div class="x0" style="width: 100%; height: 100%; position: relative; overflow: hidden; background: #F3F7FC; font-family: 'Plus Jakarta Sans','Noto Sans KR',sans-serif; color: #0B1F3A">
  <div style="height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 120px">

    <div style="position: relative; background: #1463FF; padding: calc(20px + env(safe-area-inset-top)) 22px 70px; color: #FFFFFF; overflow: hidden">
      <div class="x0-bubble" style="position: absolute; left: 40px; bottom: 30px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6)"></div>
      <div class="x0-bubble" style="position: absolute; left: 300px; bottom: 20px; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); animation-delay: 1.4s"></div>
      <div class="x0-bubble" style="position: absolute; left: 190px; bottom: 40px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6); animation-delay: 2.6s"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <a href="Location.dc.html" aria-label="위치 변경" style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); color: #FFFFFF; border-radius: 999px; padding: 8px 14px 8px 10px; font-size: 13px; font-weight: 700; min-height: 40px; text-decoration: none; min-width: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{locName}}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg>
        </a>
        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
          <sc-if value="{{loading}}" hint-placeholder-val="{{false}}"><svg class="x0-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-label="불러오는 중"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></sc-if>
          <div style="font-size: 13px; font-weight: 600; opacity: .9">{{dateLabel}}</div>
        </div>
      </div>

      <a href="Solunar.dc.html" style="display: flex; align-items: center; gap: 22px; margin-top: 26px; color: #FFFFFF; text-decoration: none">
        <div style="position: relative; width: 128px; height: 128px; flex-shrink: 0">
          <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true">
            <circle cx="64" cy="64" r="52" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="12"></circle>
            <circle class="x0-ring" cx="64" cy="64" r="52" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="{{ringOffset}}" transform="rotate(-90 64 64)"></circle>
          </svg>
          <div class="x0-count" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <div style="font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -1.5px">{{score}}</div>
            <div style="font-size: 11px; font-weight: 700; opacity: .85; margin-top: 4px">/ 100</div>
          </div>
        </div>
        <div>
          <div style="font-size: 13px; font-weight: 600; opacity: .85">오늘 조황 점수</div>
          <div style="font-size: 30px; font-weight: 900; margin-top: 4px; letter-spacing: -.5px">{{grade}}</div>
          <div style="display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap">
            <div style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; color: #0B3FA8; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
              {{moonName}}
            </div>
            <sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><div style="background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700">{{badge}}</div></sc-if>
          </div>
        </div>
      </a>

      <svg class="x0-wave2" width="780" height="40" viewBox="0 0 780 40" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; opacity: .35" aria-hidden="true"><path d="M0 22 Q97.5 6 195 22 T390 22 T585 22 T780 22 V40 H0 Z" fill="#FFFFFF"></path></svg>
      <svg class="x0-wave" width="780" height="34" viewBox="0 0 780 34" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: -1px" aria-hidden="true"><path d="M0 18 Q97.5 2 195 18 T390 18 T585 18 T780 18 V34 H0 Z" fill="#F3F7FC"></path></svg>
    </div>

    <sc-if value="{{notice.show}}" hint-placeholder-val="{{false}}">
  <div class="x0-fu" style="margin: 14px 18px 0; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: #E7F0FF; color: #1463FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"></path><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"></path></svg></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 900">{{notice.title}}</div><div style="font-size: 12px; font-weight: 600; color: #5B6B82; margin-top: 2px; line-height: 1.5; word-break: keep-all">{{notice.msg}}</div></div>
    <sc-if value="{{notice.addLink}}" hint-placeholder-val="{{false}}"><a href="Location.dc.html" style="flex-shrink: 0; background: #1463FF; color: #FFFFFF; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 800; text-decoration: none">추가</a></sc-if>
    <sc-if value="{{notice.retryBtn}}" hint-placeholder-val="{{false}}"><button onClick="{{notice.retry}}" style="flex-shrink: 0; border: 0; background: #1463FF; color: #FFFFFF; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">다시 시도</button></sc-if>
  </div>
</sc-if>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 8px 18px 0">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <a href="Marine.dc.html" class="x0-tile x0-fu" style="background: #FFFFFF; border-radius: 22px; padding: 16px; color: #0B1F3A; text-decoration: none; animation-delay: {{t.delay}}">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="width: 40px; height: 40px; border-radius: 14px; background: #E7F0FF; color: #1463FF; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{t.isSwell}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"></path><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"></path></svg></sc-if>
              <sc-if value="{{t.isWind}}" hint-placeholder-val="{{false}}"><svg class="x0-sway" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg></sc-if>
              <sc-if value="{{t.isTemp}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"></path></svg></sc-if>

      </div>

          <label style="font-size: 11px; font-weight: 700; color: #5B6B82">위도 (lat)<input value="{{latStr}}" onInput="{{onLat}}" placeholder="-33.9500" style="display: block; width: 100%; height: 44px; margin-top: 4px; border: 0; border-radius: 12px; background: #F3F7FC; padding: 0 12px; font-size: 14px; color: #0B1F3A"></label>

    </div>
  </div>
</div>

          <button class="x5-chip" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="border: 0; border-radius: 999px; min-height: 36px; padding: 0 14px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; background: {{g.bg}}; color: {{g.fg}}">{{g.label}}</button>

      </div>

      <div style="display: flex; gap: 10px; overflow-x: auto; padding: 12px 18px 6px">
        <sc-for list="{{spList}}" as="s" hint-placeholder-count="5">
          <button class="x5-chip {{s.cls}}" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="position: relative; flex: 0 0 86px; border: 0; border-radius: 20px; padding: 12px 6px 10px; font: inherit; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 900; background: {{s.badgeBg}}; color: {{s.badgeFg}}; border-radius: 8px; padding: 2px 6px">{{s.score}}</span>
            <svg class="x5-swim" width="40" height="26" viewBox="0 0 48 32" aria-hidden="true" style="margin-top: 10px"><ellipse cx="22" cy="16" rx="18" ry="10" fill="{{s.tint}}"></ellipse><polygon points="40,16 48,8 48,24" fill="{{s.tint}}"></polygon><circle cx="10" cy="13" r="2" fill="{{s.eye}}"></circle></svg>
            <span style="font-size: 11px; font-weight: 800; text-align: center; line-height: 1.2">{{s.name}}</span>
            <sc-if value="{{s.isRec}}" hint-placeholder-val="{{false}}"><span style="font-size: 9px; font-weight: 900; background: #0B1F3A; color: #FFFFFF; border-radius: 6px; padding: 2px 6px">추천</span></sc-if>
          </button>
        </sc-for>
      </div>

      <!-- RESULT -->
      <div class="x5-fu" style="margin: 8px 18px 0; background: #FFFFFF; border-radius: 26px; padding: 18px">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="flex: 1"><div style="font-size: 20px; font-weight: 900">{{r.name}}</div><div style="font-size: 11px; font-weight: 600; color: #5B6B82; margin-top: 2px">WillyWeather + Open-Meteo 기반</div></div>
          <div style="position: relative; width: 52px; height: 52px">
            <svg width="52" height="52" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="#EEF3FA" stroke-width="5"></circle><circle class="x5-ring" cx="22" cy="22" r="17" fill="none" stroke="#1463FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="107" stroke-dashoffset="{{r.off}}" transform="rotate(-90 22 22)"></circle></svg>
            <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #1463FF">{{r.score}}</div>
          </div>
        </div>

        <div style="font-size: 13px; font-weight: 900; margin-top: 18px">채비 세팅</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px">
          <sc-for list="{{r.rig}}" as="g" hint-placeholder-count="6">
            <div style="background: #F3F7FC; border-radius: 12px; padding: 9px 11px"><div style="font-size: 10px; font-weight: 800; color: #5B6B82; letter-spacing: .4px">{{g.lbl}}</div><div style="font-size: 13px; font-weight: 800; margin-top: 2px">{{g.val}}</div></div>
          </sc-for>
        </div>
        <!-- rig infographic -->
        <div style="display: flex; align-items: flex-start; margin-top: 12px; background: #E7F0FF; border-radius: 16px; padding: 12px 8px">
          <sc-for list="{{r.rigFlow}}" as="n" hint-placeholder-count="4">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative">
              <span style="width: 34px; height: 34px; border-radius: 50%; background: #1463FF; color: #FFFFFF; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; z-index: 1">{{n.i}}</span>
              <sc-if value="{{n.hasLine}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 16px; left: 50%; width: 100%; height: 2px; background: #8CC4FF"></span></sc-if>
              <span style="font-size: 10px; font-weight: 800; color: #0B3FA8">{{n.lbl}}</span>
              <span style="font-size: 10px; font-weight: 700; color: #3A4A61; text-align: center; line-height: 1.3; padding: 0 2px">{{n.val}}</span>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{r.hasColors}}" hint-placeholder-val="{{true}}">
          <div style="font-size: 13px; font-weight: 900; margin-top: 18px">추천 컬러</div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px">
            <sc-for list="{{r.colors}}" as="c" hint-placeholder-count="4">
              <div style="display: flex; gap: 8px; align-items: center; background: {{c.bg}}; border-radius: 12px; padding: 8px 10px">
                <span style="width: 24px; height: 24px; border-radius: 8px; background: {{c.h}}; box-shadow: 0 0 0 1px #E3EAF4; flex-shrink: 0"></span>
                <span style="min-width: 0"><span style="display: block; font-size: 12px; font-weight: 800">{{c.n}}</span><span style="display: block; font-size: 10px; font-weight: 600; color: #5B6B82">{{c.w}}</span></span>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div style="font-size: 13px; font-weight: 900; margin-top: 18px">미끼 추천</div>
        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px">
          <sc-for list="{{r.baits}}" as="b" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 10px; background: #F3F7FC; border-radius: 12px; padding: 9px 11px">
              <span style="width: 22px; height: 22px; border-radius: 50%; background: {{b.rankBg}}; color: {{b.rankFg}}; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{b.r}}</span>
              <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 800">{{b.n}}</span><span style="display: block; font-size: 10px; font-weight: 600; color: #5B6B82">{{b.w}}</span></span>
              <span style="display: flex; gap: 3px"><sc-for list="{{b.dots}}" as="d" hint-placeholder-count="5"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{d}}"></span></sc-for></span>
            </div>
          </sc-for>
        </div>

        <div style="font-size: 13px; font-weight: 900; margin-top: 18px">최적 조수 조건</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px">
          <div style="background: #F3F7FC; border-radius: 12px; padding: 10px 11px"><div style="font-size: 10px; font-weight: 800; color: #5B6B82">최적 시간대</div><div style="font-size: 13px; font-weight: 800; color: #0B3FA8; margin-top: 2px">{{r.tide.bestTime}}</div><div style="font-size: 10px; font-weight: 600; color: #5B6B82; margin-top: 2px">{{r.tide.bestTimeNote}}</div></div>
          <div style="background: #F3F7FC; border-radius: 12px; padding: 10px 11px"><div style="font-size: 10px; font-weight: 800; color: #5B6B82">조수 상태</div><div style="font-size: 13px; font-weight: 800; color: #0B3FA8; margin-top: 2px">{{r.tide.tidalState}}</div><div style="font-size: 10px; font-weight: 600; color: #5B6B82; margin-top: 2px">{{r.tide.tidalNote}}</div></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 6px">
          <sc-for list="{{r.tideBars}}" as="t" hint-placeholder-count="4">
            <div style="background: #F3F7FC; border-radius: 12px; padding: 9px 4px 8px; text-align: center">
              <div style="font-size: 11px; font-weight: 800">{{t.lbl}}</div>
              <div style="display: flex; gap: 2px; justify-content: center; align-items: flex-end; height: 26px; margin-top: 6px">
                <sc-for list="{{t.bars}}" as="b" hint-placeholder-count="5"><span style="width: 5px; height: {{b.h}}; border-radius: 2px; background: {{b.c}}"></span></sc-for>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: 6px; background: #E7F0FF; border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 600; color: #0B3FA8; line-height: 1.55">{{r.tide.tip}}</div>

        <div style="font-size: 13px; font-weight: 900; margin-top: 18px">공략 위험도</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
          <span style="font-size: 12px; font-weight: 900; color: {{r.dl.fg}}; min-width: 56px">{{r.dl.label}}</span>
          <div style="flex: 1; height: 10px; border-radius: 5px; background: #EEF3FA; overflow: hidden"><div class="x5-bar" style="height: 10px; width: {{r.dl.w}}; background: {{r.dl.fg}}; border-radius: 5px"></div></div>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #5B6B82; margin-top: 6px">{{r.dl.desc}}</div>

        <div style="font-size: 13px; font-weight: 900; margin-top: 18px">수온 적합도 미터</div>
        <div style="background: #F3F7FC; border-radius: 14px; padding: 12px; margin-top: 8px">
          <div style="font-size: 11px; font-weight: 700; color: #5B6B82">현재 수온 vs 최적 수온 ({{r.sst.opt}})</div>
          <sc-if value="{{r.sst.none}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; font-weight: 700; color: #5B6B82; margin-top: 8px">수온 데이터 로딩 중… 최적 범위 {{r.sst.opt}}</div></sc-if>
          <sc-if value="{{r.sst.has}}" hint-placeholder-val="{{true}}">
          <div style="position: relative; height: 12px; border-radius: 6px; background: #E3EAF4; margin-top: 10px">
            <div style="position: absolute; top: 0; bottom: 0; left: {{r.sst.optL}}; width: {{r.sst.optW}}; background: #CFE1FF; border-radius: 6px"></div>
            <div class="x5-bar" style="position: absolute; top: 0; bottom: 0; left: 0; width: {{r.sst.pct}}; background: #1463FF; border-radius: 6px; opacity: .25"></div>
            <span style="position: absolute; top: -4px; left: {{r.sst.pct}}; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #1463FF; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(11,31,58,.2)"></span>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #5B6B82; margin-top: 8px"><span>{{r.sst.lo}}</span><span style="color: #0B3FA8; font-weight: 900">{{r.sst.cur}} 현재</span><span>{{r.sst.hi}}</span></div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px"><span style="font-size: 13px; font-weight: 900; color: {{r.sst.fg}}">{{r.sst.label}}</span><span style="font-size: 13px; font-weight: 900; color: {{r.sst.fg}}">{{r.sst.fit}}%</span></div>
          </sc-if>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px">
          <div style="font-size: 13px; font-weight: 900">오늘 조건 분석</div>
          <button class="x5-chip" onClick="{{reAnalyse}}" style="border: 0; border-radius: 10px; min-height: 32px; padding: 0 10px; background: #E7F0FF; color: #1463FF; font: inherit; font-size: 11px; font-weight: 800; cursor: pointer">다시 분석</button>
        </div>
        <div class="x5-fu" style="background: #0B1F3A; color: #FFFFFF; border-radius: 16px; padding: 14px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{r.analysis}}" as="p" hint-placeholder-count="3">
            <div style="font-size: 12px; font-weight: {{p.w}}; line-height: 1.6; opacity: {{p.o}}">{{p.t}}</div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- ═══ 도감 ═══ -->
    <sc-if value="{{isDex}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{noDetail}}" hint-placeholder-val="{{true}}">
        <div style="position: relative; margin: 14px 18px 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input aria-label="어종 검색" placeholder="어종 · 서식지 검색" value="{{q}}" onInput="{{onQ}}" style="width: 100%; height: 44px; border: 0; border-radius: 14px; background: #FFFFFF; padding: 0 14px 0 42px; font-size: 14px; color: #0B1F3A">
        </div>
        <div style="display: flex; gap: 6px; padding: 10px 18px 0">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button class="x5-chip" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="border: 0; border-radius: 999px; min-height: 36px; padding: 0 14px; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
          </sc-for>
          <span style="margin-left: auto; align-self: center; font-size: 11px; font-weight: 700; color: #5B6B82">{{dexCount}}종</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 0">
          <sc-for list="{{dex}}" as="f" hint-placeholder-count="6">
            <button class="x5-chip" onClick="{{f.open}}" style="border: 0; background: #FFFFFF; border-radius: 18px; padding: 10px 12px; font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px">
              <span style="width: 52px; height: 40px; border-radius: 12px; background: #E7F0FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="38" height="24" viewBox="0 0 48 32" aria-hidden="true"><ellipse cx="22" cy="16" rx="18" ry="10" fill="{{f.tint}}"></ellipse><polygon points="40,16 48,8 48,24" fill="{{f.tint}}"></polygon><circle cx="10" cy="13" r="2" fill="#FFFFFF"></circle></svg></span>
              <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span style="display: block; font-size: 11px; font-weight: 600; color: #5B6B82; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.meta}}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0">
                <sc-if value="{{f.hasBadge}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 900; background: {{f.badgeBg}}; color: {{f.badgeFg}}; border-radius: 6px; padding: 2px 6px">{{f.badge}}</span></sc-if>
                <span style="font-size: 12px; font-weight: 800; color: #0B3FA8">{{f.size}}</span>
              </span>
            </button>
          </sc-for>
          <sc-if value="{{dexEmpty}}" hint-placeholder-val="{{false}}"><div style="text-align: center; padding: 30px 0; font-size: 13px; font-weight: 700; color: #5B6B82">검색 결과 없음</div></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{hasDetail}}" hint-placeholder-val="{{false}}">
        <div class="x5-fu" style="margin: 14px 18px 0">
          <button class="x5-chip" onClick="{{closeDetail}}" style="border: 0; background: #FFFFFF; border-radius: 12px; min-height: 40px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 800; color: #1463FF; cursor: pointer">← 뒤로</button>
          <div style="background: #1463FF; color: #FFFFFF; border-radius: 26px; padding: 20px; margin-top: 10px; display: flex; gap: 14px; align-items: center">
            <svg class="x5-swim" width="84" height="56" viewBox="0 0 48 32" aria-hidden="true" style="flex-shrink: 0"><ellipse cx="22" cy="16" rx="18" ry="10" fill="#FFFFFF"></ellipse><polygon points="40,16 48,8 48,24" fill="#FFFFFF"></polygon><circle cx="10" cy="13" r="2" fill="#1463FF"></circle></svg>
            <div><div style="font-size: 19px; font-weight: 900; line-height: 1.25">{{det.name}}</div><div style="font-size: 12px; font-weight: 600; opacity: .9; margin-top: 4px">{{det.habitat}}</div></div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px"><sc-for list="{{det.tags}}" as="t" hint-placeholder-count="2"><span style="font-size: 11px; font-weight: 800; background: #E7F0FF; color: #0B3FA8; border-radius: 8px; padding: 4px 9px">{{t}}</span></sc-for></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px">
            <div style="background: #FFFFFF; border-radius: 16px; padding: 12px"><div style="font-size: 11px; font-weight: 700; color: #5B6B82">최소 사이즈</div><div style="font-size: 16px; font-weight: 900; margin-top: 3px">{{det.size}}</div></div>
            <div style="background: #FFFFFF; border-radius: 16px; padding: 12px"><div style="font-size: 11px; font-weight: 700; color: #5B6B82">조업 한도</div><div style="font-size: 16px; font-weight: 900; margin-top: 3px">{{det.bag}}/일</div></div>
            <div style="background: #FFFFFF; border-radius: 16px; padding: 12px"><div style="font-size: 11px; font-weight: 700; color: #5B6B82">시즌</div><div style="font-size: 14px; font-weight: 900; margin-top: 3px">{{det.season}}</div></div>
            <div style="background: #FFFFFF; border-radius: 16px; padding: 12px"><div style="font-size: 11px; font-weight: 700; color: #5B6B82">피크</div><div style="font-size: 14px; font-weight: 900; margin-top: 3px">{{det.peak}}</div></div>
          </div>
          <div style="background: #FFFFFF; border-radius: 18px; padding: 14px; margin-top: 8px"><div style="font-size: 13px; font-weight: 900">특징</div><div style="font-size: 13px; font-weight: 500; color: #3A4A61; line-height: 1.6; margin-top: 6px">{{det.desc}}</div></div>
          <div style="background: #FFFFFF; border-radius: 18px; padding: 14px; margin-top: 8px"><div style="font-size: 13px; font-weight: 900">낚시 방법</div><div style="font-size: 13px; font-weight: 500; color: #3A4A61; line-height: 1.6; margin-top: 6px">{{det.method}}</div></div>
        </div>
      </sc-if>
    </sc-if>

    <!-- ═══ DPI · 규정 ═══ -->
    <sc-if value="{{isDpi}}" hint-placeholder-val="{{false}}">
      <div style="padding: 16px 22px 8px; font-size: 15px; font-weight: 800">NSW 규정</div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 18px">
        <sc-for list="{{rules}}" as="n" hint-placeholder-count="6">
          <div class="x5-fu" style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; animation-delay: {{n.delay}}">
            <span style="width: 32px; height: 32px; border-radius: 10px; background: #E7F0FF; color: #1463FF; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{n.i}}</span>
            <span><span style="display: block; font-size: 14px; font-weight: 800">{{n.title}}</span><span style="display: block; font-size: 12px; font-weight: 500; color: #3A4A61; line-height: 1.55; margin-top: 3px">{{n.desc}}</span></span>
          </div>
        </sc-for>
        <div style="font-size: 11px; font-weight: 600; color: #5B6B82; line-height: 1.6; padding: 4px 4px 0">정보는 참고용입니다. 출조 전 반드시 NSW DPI 공식 사이트에서 최신 규정을 확인하세요. <a href="https://www.dpi.nsw.gov.au/fishing" target="_blank" rel="noopener" style="font-weight: 800">NSW DPI 공식 사이트</a></div>
      </div>
      <div style="padding: 20px 22px 8px; display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 15px; font-weight: 800">DPI 쇼어 피싱 20종</div><div style="font-size: 11px; font-weight: 700; color: #5B6B82">Min size · Bag/day</div></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 18px">
        <sc-for list="{{dpi}}" as="d" hint-placeholder-count="6">
          <div class="x5-fu" style="background: #FFFFFF; border-radius: 18px; overflow: hidden; animation-delay: {{d.delay}}">
            <div style="height: 70px; background: #E7F0FF; display: flex; align-items: center; justify-content: center"><svg class="x5-swim" width="64" height="40" viewBox="0 0 48 32" aria-hidden="true"><ellipse cx="22" cy="16" rx="18" ry="10" fill="{{d.tint}}"></ellipse><polygon points="40,16 48,8 48,24" fill="{{d.tint}}"></polygon><circle cx="10" cy="13" r="2" fill="#FFFFFF"></circle></svg></div>
            <div style="padding: 10px 12px 12px">
              <div style="font-size: 13px; font-weight: 900">{{d.name}}</div>
              <div style="font-size: 11px; font-weight: 600; color: #5B6B82; margin-top: 2px">{{d.desc}}</div>
              <div style="display: flex; gap: 6px; margin-top: 8px">
                <span style="font-size: 11px; font-weight: 800; color: #0B3FA8; background: #E7F0FF; border-radius: 7px; padding: 3px 7px">{{d.size}}</span>
                <span style="font-size: 11px; font-weight: 800; color: #FFFFFF; background: #0B3FA8; border-radius: 7px; padding: 3px 7px">{{d.bag}}/일</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>

<script type="text/plain" id="js-Main">
class Component extends DCLogic {
  renderVals() {
    const SF = window.SF, md = SF.today(), now = new Date();
    const D = SF.sol.days(1)[0];
    const b = SF.blend(D.s, md), T = SF.tier(b.score);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const pk = [[D.pk.m1, 'MAJOR', 120], [D.pk.m2, 'MAJOR', 120], [D.pk.n1, 'MINOR', 60], [D.pk.n2, 'MINOR', 60]].map(x => { const [h, m] = x[0].split(':').map(Number); return { m: h * 60 + m, type: x[1], dur: x[2], t: x[0] }; });
    const up = pk.map(p => ({ p, d: (p.m - nowMin + 1440) % 1440 })).sort((a, c) => a.d - c.d)[0];
    const next = { type: up.p.type, time: up.p.t, inTxt: Math.floor(up.d / 60) + '시간 ' + (up.d % 60) + '분', bg: up.p.type === 'MAJOR' ? '#0B3FA8' : '#8CC4FF', fg: up.p.type === 'MAJOR' ? '#FFFFFF' : '#0B1F3A' };
    const peaks = pk.map((p, i) => ({ left: (p.m / 1440 * 100).toFixed(1) + '%', width: (Math.min(p.dur, 1440 - p.m) / 1440 * 100).toFixed(1) + '%', color: p.type === 'MAJOR' ? '#0B3FA8' : '#8CC4FF', delay: (0.7 + 0.1 * i).toFixed(1) + 's' }));
    const dash = v => (v == null ? '—' : String(v));
    const good = { bg: '#E3F6EC', fg: '#13703F' }, mid = { bg: '#E7F0FF', fg: '#0B3FA8' }, bad = { bg: '#FFF1E8', fg: '#C2410C' };
    const swT = !md ? mid : md.swellH < 1.5 ? good : md.swellH < 2.5 ? mid : bad;
    const wiT = !md ? mid : md.windKmh < 20 ? good : md.windKmh < 35 ? mid : bad;
    const tmr = SF.marine.days[1];
    const nextTide = md ? (md.tides.find(t => t.h * 60 + t.m > nowMin) || (tmr && tmr.tides[0] ? Object.assign({ tmr: true }, tmr.tides[0]) : null)) : null;
    const tiles = [
      { label: md ? '파고 · ' + md.swellD + ' ' + md.swellPer + '초' : '파고', value: md ? md.swellH.toFixed(1) : '—', unit: 'm', tag: md ? (md.swellH < 1.5 ? '좋음' : md.swellH < 2.5 ? '보통' : '높음') : '—', tagBg: swT.bg, tagFg: swT.fg, isSwell: true, delay: '.1s' },
      { label: md ? '풍속 · ' + md.windD + ' · 돌풍 ' + md.windGust : '풍속', value: md ? String(md.windKmh) : '—', unit: 'km/h', tag: md ? (md.windKmh < 20 ? '약함' : md.windKmh < 35 ? '보통' : '강함') : '—', tagBg: wiT.bg, tagFg: wiT.fg, isWind: true, delay: '.18s' },
      { label: '수온 (SST)', value: md && md.sst != null ? String(md.sst) : '—', unit: '°C', tag: md && md.sst != null ? (md.sst >= 19 ? '킹피시 OK' : '쿨워터') : 'N/A', tagBg: mid.bg, tagFg: mid.fg, isTemp: true, delay: '.26s' },
      { label: nextTide ? (nextTide.tmr ? '내일 ' : '다음 ') + (nextTide.type === 'high' ? '만조' : '간조') + ' · ' + nextTide.height + 'm' : '다음 물때', value: nextTide ? SF.f2(nextTide.h, nextTide.m) : '—', unit: '', tag: nextTide ? (nextTide.type === 'high' ? '들물' : '날물') : '—', tagBg: mid.bg, tagFg: mid.fg, isTide: true, delay: '.34s' }
    ];
    let tide = { path: '', area: '', nowX: 0, nowY: 0 }, tideList = [];
    if (md && md.tides.length) {
      const c = SF.tideCurve(md.tides, 320, 96, 6);
      tide = { path: c.path, area: c.area, nowX: c.xAt(nowMin).toFixed(1), nowY: c.yAt(nowMin).toFixed(1) };
      tideList = md.tides.slice(0, 4).map(t => ({ lbl: t.type === 'high' ? '만조' : '간조', col: t.type === 'high' ? '#1463FF' : '#5B6B82', time: SF.f2(t.h, t.m), ht: String(t.height) }));
    }
    return {
      locName: SF.locName(), loading: SF.marine.status === 'loading', notice: SF.notice(),
      dateLabel: (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + SF.DOW[now.getDay()],
      score: String(b.score), ringOffset: Math.round(327 - 327 * b.score / 100), grade: T.g, moonName: D.moon.n,
      hasBadge: !!b.label, badge: b.label ? b.label.text : '',
      tiles, next, peaks, nowPct: (nowMin / 1440 * 100).toFixed(2) + '%',
      hasTide: tideList.length > 0, tide, tideList, tr: SF.trOf(md).toFixed(1)
    };
  }
}
</script>

<script type="text/plain" id="js-Solunar">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 0, sec: 0, running: false }; this._t = null; }
  componentWillUnmount() { if (this._t) clearInterval(this._t); }
  renderVals() {
    const SF = window.SF;
    // ── 원본 v7 솔루나 엔진 그대로 ──
    const LUNAR_REF = Date.parse('2025-01-29T12:36:00Z'), CYC = 29.53058867;
    const lunarAge = d => ((((d - LUNAR_REF) / 86400000) % CYC) + CYC) % CYC;
    const moonPhase = a => {
      if (a < 1.85) return { n: '그믐달 (신월)', pct: 2 };
      if (a < 7.38) return { n: '초승달', pct: Math.round(a / 7.38 * 48) + 2 };
      if (a < 9.22) return { n: '상현달', pct: 50 };
      if (a < 14.76) return { n: '상현 보름달', pct: Math.round(50 + (a - 9.22) / 5.54 * 48) };
      if (a < 16.61) return { n: '보름달', pct: 98 };
      if (a < 22.15) return { n: '하현 보름달', pct: Math.round(98 - (a - 14.76) / 7.38 * 48) };
      if (a < 23.99) return { n: '하현달', pct: 50 };
      return { n: '그믐달', pct: Math.round((29.53 - a) / 5.54 * 48) };
    };
    const getSolScore = age => {
      const ph = age / 29.53;
      const P = [[0,96],[.05,83],[.08,60],[.12,27],[.15,15],[.18,15],[.25,69],[.32,15],[.35,15],[.38,27],[.42,60],[.45,83],[.5,96],[.55,83],[.58,60],[.62,27],[.65,15],[.68,15],[.75,69],[.82,15],[.85,15],[.88,27],[.92,60],[.95,83],[1,96]];
      let p1 = P[0], p2 = P[P.length - 1];
      for (let i = 0; i < P.length - 1; i++) if (ph >= P[i][0] && ph <= P[i + 1][0]) { p1 = P[i]; p2 = P[i + 1]; break; }
      if (p1[0] === p2[0]) return p1[1];
      return Math.round(p1[1] + (ph - p1[0]) / (p2[0] - p1[0]) * (p2[1] - p1[1]));
    };
    const peaksOf = d => {
      const L = 1490.5, r = Date.parse('2025-01-29T00:00:00Z');
      const o = ((((d - r) / 60000) % L) + L) % L;
      const hm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
      const add = (t, n) => { const [h, m] = t.split(':').map(Number), v = h * 60 + m + n; return String(Math.floor(v / 60) % 24).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); };
      const m1 = hm(o), m2 = hm((o + L / 2) % L), n1 = hm((o + L / 4) % L), n2 = hm((o + 3 * L / 4) % L);
      return { m1, m1e: add(m1, 120), m2, m2e: add(m2, 120), n1, n1e: add(n1, 60), n2, n2e: add(n2, 60) };
    };
    const activityH = (p, s) => {
      const ph = t => { const [h, m] = t.split(':').map(Number); return h + m / 60; };
      const a = ph(p.m1), b = ph(p.m2), c = ph(p.n1), e = ph(p.n2);
      return Array.from({ length: 24 }, (_, h) => {
        const dd = x => Math.min(Math.abs(h - x), 24 - Math.abs(h - x));
        return Math.round(Math.min(99, Math.max(12, s * Math.max(0, 1 - dd(a) / 2), s * Math.max(0, 1 - dd(b) / 2), s * .6 * Math.max(0, 1 - dd(c)), s * .6 * Math.max(0, 1 - dd(e)))));
      });
    };
    // ── 해양 데이터 (WillyWeather 연동 자리 — 디자인용 샘플) ──
    const MD = SF.marine.days;
    const blend = (s, md) => {
      if (!md) return { score: s, penalty: 0, bonus: 0, label: null };
      let pen = 0, bon = 0;
      if (md.swellH >= 3.5) pen += 30; else if (md.swellH >= 2.5) pen += 15; else if (md.swellH >= 2.0) pen += 5;
      if (md.windKmh >= 50) pen += 20; else if (md.windKmh >= 35) pen += 10; else if (md.windKmh >= 25) pen += 4;
      if (md.pressure >= 1018) bon += 8; else if (md.pressure >= 1013) bon += 3; else if (md.pressure < 1005) pen += 10;
      if (md.rain >= 70) pen += 8; else if (md.rain >= 40) pen += 4;
      const score = Math.max(5, Math.min(99, s - pen + bon));
      let label = null;
      if (pen > 20) label = { text: '파도·바람 패널티 -' + pen, warn: true };
      else if (bon >= 8) label = { text: '고기압 보너스 +' + bon, warn: false };
      else if (pen > 0) label = { text: '날씨 조정 -' + pen, warn: true };
      return { score, penalty: pen, bonus: bon, label };
    };
    const tier = s => s >= 90 ? { c: '#0B3FA8', g: 'PRIME', fg: '#FFFFFF' } : s >= 70 ? { c: '#1463FF', g: '좋음', fg: '#FFFFFF' } : s >= 50 ? { c: '#3D7BFF', g: '양호', fg: '#FFFFFF' } : s >= 30 ? { c: '#8CC4FF', g: '보통', fg: '#0B1F3A' } : { c: '#B8C6DA', g: '조과 불량', fg: '#0B1F3A' };
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];
    const f2 = (h, m) => String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');

    const now = new Date();
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(12, 0, 0, 0);
      const age = lunarAge(d.getTime()), moon = moonPhase(age), s = getSolScore(age);
      const pk = peaksOf(d.getTime());
      const b = blend(s, MD[i]);
      days.push({ d, age, moon, s, pk, act: activityH(pk, s), b, md: MD[i] });
    }
    const sel = this.state.day, D = days[sel], md = D.md;

    const strip = days.map((x, i) => {
      const on = i === sel, waning = x.age > 14.77;
      return {
        dow: i === 0 ? '오늘' : DOW[x.d.getDay()], num: String(x.d.getDate()), score: String(x.b.score), drop: x.b.penalty > 0 ? '▼' : '',
        aria: (x.d.getMonth() + 1) + '월 ' + x.d.getDate() + '일 점수 ' + x.b.score,
        on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'rgba(255,255,255,.1)', fg: on ? '#0B3FA8' : '#FFFFFF',
        moonDark: on ? '#CFE1FF' : 'rgba(255,255,255,.25)', moonLight: on ? '#1463FF' : '#FFFFFF',
        moonL: waning ? '0' : 'auto', moonR: waning ? 'auto' : '0', moonLit: x.moon.pct + '%',
        pick: () => this.setState({ day: i })
      };
    });

    // 경고
    const warnings = [];
    if (md) {
    const di = md.swellH * md.swellPer;
    if (di >= 18 || md.swellH >= 2.5) warnings.push({ text: '파도 위험 (위험지수 ' + di.toFixed(0) + ') — 갯바위 낚시 금지', bg: '#FFF1E8', fg: '#C2410C' });
    else if (di >= 12 || md.swellPer >= 10) warnings.push({ text: '파도 주의 (위험지수 ' + di.toFixed(0) + ') — 안전 확인 필요', bg: '#FFF7E0', fg: '#8A5A00' });
    let presDrop = false;
    if (sel > 0) presDrop = Math.abs(md.pressure - MD[sel - 1].pressure) >= 3; else if (MD[1]) presDrop = Math.abs(md.pressure - MD[1].pressure) >= 3;
    if (presDrop || md.windGust > 40) warnings.push({ text: '기압 급변 — 물고기 활성도 급증 예상', bg: '#E7F0FF', fg: '#0B3FA8' });
    const tm = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const sr = tm(md.sunrise), ss = tm(md.sunset);
    const overlap = [D.pk.m1, D.pk.m2, D.pk.n1, D.pk.n2].map(tm).some(p => Math.abs(p - sr) <= 90 || Math.abs(p - ss) <= 90 || Math.abs(p + 1440 - sr) <= 90 || Math.abs(p + 1440 - ss) <= 90);
    if (overlap) warnings.push({ text: '일출/일몰 겹침 — 피딩 증폭', bg: '#E3F6EC', fg: '#13703F' });
    }

    const T = tier(D.b.score);
    const hero = {
      score: String(D.b.score), col: T.c, grade: T.g, gradeFg: T.fg,
      off: (528 * (1 - D.b.score / 100)).toFixed(1),
      raw: (D.b.penalty > 0 || D.b.bonus > 0) ? '달 기준 ' + D.s + '점 → 날씨 보정' : '달 기준 ' + D.s + '점',
      hasBadge: !!D.b.label, badge: D.b.label ? D.b.label.text : '',
      badgeBg: D.b.label && D.b.label.warn ? '#FFF1E8' : '#E3F6EC', badgeFg: D.b.label && D.b.label.warn ? '#C2410C' : '#13703F'
    };

    // 달 위상 SVG (원본 moonPhaseSVG 알고리즘, 하현 판정은 월령 기준으로 수정)
    const r = 46, cx = 50, cy = 50, il = Math.max(0, Math.min(100, D.moon.pct)) / 100, waning = D.age > 14.77;
    const tx = r * Math.abs(Math.cos(Math.PI * il));
    let dPath = 'M0 0';
    if (il >= .98) dPath = 'M50 4 A46 46 0 1 1 50 96 A46 46 0 1 1 50 4 Z';
    else if (il > .02) {
      if (!waning) dPath = 'M' + cx + ',' + (cy - r) + ' A' + r + ',' + r + ' 0 1,1 ' + cx + ',' + (cy + r) + ' A' + tx.toFixed(1) + ',' + r + ' 0 1,' + (il > .5 ? 1 : 0) + ' ' + cx + ',' + (cy - r);
      else dPath = 'M' + cx + ',' + (cy - r) + ' A' + r + ',' + r + ' 0 1,0 ' + cx + ',' + (cy + r) + ' A' + tx.toFixed(1) + ',' + r + ' 0 1,' + (il > .5 ? 0 : 1) + ' ' + cx + ',' + (cy - r);
    }
    const moon = {
      d: dPath, name: D.moon.n, pct: String(D.moon.pct), pctW: D.moon.pct + '%',
      dist: Math.round(384400 - 21000 * Math.cos(2 * Math.PI * D.age / 27.55)).toLocaleString(), age: D.age.toFixed(1)
    };

    const pkRaw = [['★ MAJOR', D.pk.m1, D.pk.m1e, '달 남중 · 2h', true], ['★ MAJOR', D.pk.m2, D.pk.m2e, '달 지중 · 2h', true], ['◆ MINOR', D.pk.n1, D.pk.n1e, '월출 · 1h', false], ['◆ MINOR', D.pk.n2, D.pk.n2e, '월몰 · 1h', false]];
    const peaks = pkRaw.map((p, i) => ({
      tag: p[0], start: p[1], end: p[2], note: p[3],
      bg: p[4] ? '#1463FF' : '#FFFFFF', fg: p[4] ? '#FFFFFF' : '#0B1F3A',
      tagBg: p[4] ? '#FFFFFF' : '#8CC4FF', tagFg: p[4] ? '#0B3FA8' : '#0B1F3A', delay: (0.05 * i).toFixed(2) + 's'
    }));

    const nowH = now.getHours();
    const act = D.act.map((v, h) => ({
      v: String(v), h: v + 'px', lbl: h === 0 ? '12A' : h < 12 ? h + 'A' : h === 12 ? '12P' : (h - 12) + 'P',
      bg: v > 75 ? '#0B3FA8' : v > 50 ? '#1463FF' : '#CFE1FF', txt: v > 75 ? '#0B3FA8' : '#5B6B82',
      isNow: sel === 0 && h === nowH, delay: (0.02 * h).toFixed(2) + 's'
    }));

    const ranked = days.map((x, i) => {
      const xm = x.md || { swellH: 0, swellPer: 0 }; const dd = xm.swellH * xm.swellPer;
      const pen = dd >= 18 ? -30 : dd >= 12 ? -15 : xm.swellH >= 2.0 ? -10 : 0;
      return { i, x, score: Math.max(0, x.b.score + pen), dd };
    }).sort((a, b) => b.score - a.score).slice(0, 3);
    const top3 = ranked.map((t, k) => ({
      rank: String(k + 1), label: t.i === 0 ? '오늘' : DOW[t.x.d.getDay()] + ' ' + t.x.d.getDate(), score: String(t.score), sw: t.x.md ? t.x.md.swellH + 'm' : '—',
      hasWarn: t.dd >= 12, warn: t.dd >= 18 ? '파도 위험' : '주의',
      bg: k === 0 ? '#1463FF' : '#FFFFFF', fg: k === 0 ? '#FFFFFF' : '#0B1F3A',
      rankBg: k === 0 ? '#FFFFFF' : '#E7F0FF', rankFg: k === 0 ? '#1463FF' : '#0B3FA8', cls: k === 0 ? 'x1-shine' : '',
      delay: (0.08 * k).toFixed(2) + 's', pick: () => this.setState({ day: t.i })
    }));

    const s0 = days[0].b.score, sst0 = MD[0] ? MD[0].sst : null;
    const active = sst0 != null && sst0 >= 19 && s0 >= 70, solOnly = sst0 == null && s0 >= 70;
    const season = {
      show: active || solOnly,
      title: active ? '킹피시 시즌 진입 — 수온 ' + sst0 + '°C · 조과지수 ' + s0 + '점' : '솔루나 좋음 — 조과지수 ' + s0 + '점',
      sub: active ? 'NSW 연안 수온이 킹피시 적정 범위(19°C+) 진입. 슬로우지그 80–120g + 라이브 야키 세팅 추천.' : '수온 확인 후 출조 판단. 솔루나 피크 타임 집중 공략.',
      badge: active ? '시즌 IN' : '좋은 날'
    };

    const sw = md ? md.swellH : 0, per = md ? md.swellPer : 0, danger = !!md && (sw >= 2.5 || per >= 10);
    const windows = (md ? md.tides : []).filter(t => t.type === 'low').map(t => {
      const lm = t.h * 60 + t.m, a = Math.max(0, lm - 60), z = Math.min(1439, lm + 60);
      const f = m => f2(Math.floor(m / 60), m % 60);
      return { from: f(a), to: f(z), low: f2(t.h, t.m), label: sw < 1.5 ? '최적' : sw < 2.0 ? '양호' : '주의', bg: sw < 1.5 ? '#E3F6EC' : sw < 2.0 ? '#E7F0FF' : '#FFF1E8', fg: sw < 1.5 ? '#13703F' : sw < 2.0 ? '#0B3FA8' : '#C2410C' };
    });
    const safety = {
      danger, safe: !danger, windows,
      iconBg: danger ? '#FFF1E8' : '#E3F6EC', iconFg: danger ? '#C2410C' : '#13703F',
      badge: danger ? '갯바위 위험' : '진입 가능', badgeBg: danger ? '#FFF1E8' : '#E3F6EC', badgeFg: danger ? '#C2410C' : '#13703F',
      main: !md ? '조수 데이터 로딩 후 표시돼' : danger ? '스웰 ' + sw + 'm' + (per >= 10 ? ' · 킹웨이브 주의 (' + per + 's)' : '') + ' — 접근 금지' : '스웰 ' + sw + 'm · 조건 ' + (sw < 1.5 ? '양호' : '보통') + ' — 아래 시간대 진입 권장',
      mainCol: danger ? '#C2410C' : '#0B1F3A',
      sub: danger ? '구명조끼·스파이크화 착용. 항상 동행자와 함께 출조하세요.' : '간조 전후 진입하면 파도 리셋 사이클을 충분히 관찰할 수 있어.'
    };

    const sec = this.state.sec;
    const timer = f2(Math.floor(sec / 3600), Math.floor((sec % 3600) / 60)) + ':' + String(sec % 60).padStart(2, '0');
    const toggleTimer = () => {
      if (this.state.running) { clearInterval(this._t); this._t = null; this.setState({ running: false }); }
      else { this._t = setInterval(() => this.setState({ sec: this.state.sec + 1 }), 1000); this.setState({ running: true }); }
    };
    const resetTimer = () => { if (this._t) clearInterval(this._t); this._t = null; this.setState({ running: false, sec: 0 }); };

    const dateLabel = (D.d.getMonth() + 1) + '월 ' + D.d.getDate() + '일 ' + DOW[D.d.getDay()] + (sel === 0 ? ' · 오늘' : '');
    return { locName: SF.locName(), notice: SF.notice(), strip, warnings, hero, moon, peaks, act, top3, season, safety, timer, timerBtn: this.state.running ? '정지' : '시작', timerCol: this.state.running ? '#1463FF' : '#0B1F3A', toggleTimer, resetTimer, dateLabel };
  }
}
</script>

<script type="text/plain" id="js-Marine">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const SF = window.SF, M = SF.marine, all = M.days, sel = Math.min(SF.marineDay, Math.max(0, all.length - 1)), d = all[sel];
    const base = { locName: SF.locName(), notice: SF.notice(), refresh: () => SF.loadWeather(true), spinCls: M.status === 'loading' ? 'x2-spin' : '', updated: M.updated ? '업데이트 ' + new Date(M.updated).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false }) + ' · 1시간 캐시' : '', has: !!d };
    if (!d) return Object.assign(base, { days: [], danger: { show: false }, tabs: [], cond: {}, cur: {}, bars: [], tide: { feeds: [], grid: [], marks: [], list: [] }, stats: [], hours: [], trend: { pts: [] }, sun: {} });
    const f2 = SF.f2, now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    const condOf = x => x.warn === 'good' ? { label: 'FISHABLE', sub: '출조 가능', col: '#13703F', dot: '#13703F' } : x.warn === 'rough' ? { label: 'ROUGH', sub: '출조 주의', col: '#C2410C', dot: '#C2410C' } : { label: 'MODERATE', sub: '조건 확인', col: '#8A5A00', dot: '#B7791F' };
    const days = all.map((x, i) => ({ dow: i === 0 ? '오늘' : x.dow, num: String(x.dayNum), sw: x.swellH + 'm', wi: String(x.windKmh), dot: i === sel ? '#FFFFFF' : condOf(x).dot, on: i === sel ? 'true' : 'false', aria: x.dayNum + '일 스웰 ' + x.swellH + 'm', bg: i === sel ? '#1463FF' : '#FFFFFF', fg: i === sel ? '#FFFFFF' : '#0B1F3A', pick: () => SF.setMarineDay(i) }));

    const di = d.swellH * d.swellPer;
    let danger = { show: false };
    if (di >= 25 || d.swellH >= 3.0) danger = { show: true, title: 'EXTREME DANGER — 갯바위 접근 절대 금지!', sub: '스웰 ' + d.swellH + 'm × 주기 ' + d.swellPer + 's = 위험지수 ' + di.toFixed(0) + ' (기준 25+)', bg: '#C2410C', fg: '#FFFFFF' };
    else if (di >= 18 || d.swellH >= 2.5) danger = { show: true, title: 'KING WAVES RISK — 갯바위 접근 위험!', sub: '스웰 ' + d.swellH + 'm × 주기 ' + d.swellPer + 's = 위험지수 ' + di.toFixed(0) + ' (기준 18+) · 외해 노출 지점 자제', bg: '#FFF1E8', fg: '#C2410C' };
    else if (di >= 12 || d.swellPer >= 10) danger = { show: true, title: '파도 주의 — 갯바위 안전 확인 필요', sub: '스웰 ' + d.swellH + 'm × 주기 ' + d.swellPer + 's = 위험지수 ' + di.toFixed(0) + ' · 주기 ' + d.swellPer + 's 장주기 파도', bg: '#FFF7E0', fg: '#8A5A00' };

    const t = this.state.tab;
    const nh = d.tides.find(x => x.type === 'high'), nl = d.tides.find(x => x.type === 'low');
    const modes = [
      { label: '파도', title: '스웰 높이 (Waves)', value: d.swellH.toFixed(1), unit: 'm', deg: (SF.dirToDeg(d.swellD) + 180) % 360, aLabel: '주기', aVal: d.swellPer + '초', bLabel: '방향', bVal: d.swellD, data: d.waveHourly, fmt: v => v.toFixed(1) },
      { label: '조석', title: '조차 (Tide range)', value: SF.trOf(d).toFixed(2), unit: 'm', deg: 0, aLabel: '만조', aVal: nh ? f2(nh.h, nh.m) : '—', bLabel: '간조', bVal: nl ? f2(nl.h, nl.m) : '—', data: null, fmt: v => v.toFixed(1) },
      { label: '바람', title: '풍속 (Wind)', value: String(d.windKmh), unit: 'km/h', deg: SF.dirToDeg(d.windD), aLabel: '풍향', aVal: d.windD, bLabel: '돌풍', bVal: d.windGust + ' km/h', data: d.windHourly, fmt: v => String(Math.round(v)) }
    ];
    const cur = modes[t];
    const tabs = modes.map((m, i) => ({ label: m.label, on: i === t ? 'true' : 'false', bg: i === t ? '#FFFFFF' : 'transparent', fg: i === t ? '#1463FF' : '#5B6B82', pick: () => this.setState({ tab: i }) }));
    let series;
    if (cur.data) series = [0, 3, 6, 9, 12, 15, 18, 21].map(h => cur.data[h]);
    else { const c = SF.tideCurve(d.tides, 340, 96, 0); series = [0, 3, 6, 9, 12, 15, 18, 21].map(h => (96 - c.yAt(h * 60)) / 96 * (Math.max.apply(null, d.tides.map(x => x.height).concat([1])))); }
    const mx = Math.max.apply(null, series.concat([0.1]));
    const bars = series.map((v, i) => ({ v: cur.fmt(v), h: Math.max(6, Math.round(v / mx * 70)) + 'px', t: (i * 3) + '시', bg: v === mx ? '#FFFFFF' : 'rgba(255,255,255,.45)', delay: (0.05 * i).toFixed(2) + 's' }));

    // tide chart (v7 가우시안 + 솔루나 피크 음영)
    const W = 340, H = 96, PAD = 10, c = SF.tideCurve(d.tides, W, H, PAD);
    const sd = SF.sol.days(sel + 1)[sel];
    const feeds = [[sd.pk.m1, 120, true], [sd.pk.m2, 120, true], [sd.pk.n1, 60, false], [sd.pk.n2, 60, false]].map(([pk, dur, maj]) => { const [h, m] = pk.split(':').map(Number), mn = h * 60 + m; const x = PAD + ((mn - dur / 2) / 1440) * (W - PAD * 2); return { x: Math.max(PAD, x).toFixed(1), w: ((dur / 1440) * (W - PAD * 2)).toFixed(1), fill: maj ? '#CFE1FF' : '#EEF3FA' }; });
    const grid = [0, 6, 12, 18, 24].map(h => ({ x: (PAD + (h / 24) * (W - PAD * 2)).toFixed(1), lbl: h === 0 || h === 24 ? '12AM' : h < 12 ? h + 'AM' : h === 12 ? '12PM' : (h - 12) + 'PM' }));
    const marks = d.tides.slice(0, 4).map(x => { const mn = x.h * 60 + x.m, X = c.xAt(mn), Y = c.yAt(mn), hi = x.type === 'high'; return { x: X.toFixed(1), y: Y.toFixed(1), tx: Math.max(16, Math.min(W - 16, X)).toFixed(1), ty: (hi ? Y - 9 : Y + 16).toFixed(1), ht: String(x.height), col: hi ? '#1463FF' : '#5B6B82' }; });
    const tr = SF.trOf(d);
    const tide = {
      feeds, grid, marks, path: c.path, area: c.area, showNow: sel === 0, nowX: c.xAt(nowMin).toFixed(1), nowY: c.yAt(nowMin).toFixed(1), nowTx: (c.xAt(nowMin) + 5).toFixed(1),
      tr: tr.toFixed(1), trLabel: tr > 1.5 ? '강함' : tr > 0.8 ? '보통' : '약함', note: tr > 1.5 ? '무거운 채비' : tr > 0.8 ? '표준 채비' : '라이트 채비',
      trBg: tr > 1.5 ? '#FFF1E8' : '#E7F0FF', trFg: tr > 1.5 ? '#C2410C' : '#0B3FA8',
      list: d.tides.slice(0, 4).map(x => ({ lbl: x.type === 'high' ? 'HIGH' : 'LOW', col: x.type === 'high' ? '#1463FF' : '#5B6B82', time: f2(x.h, x.m), ht: String(x.height) }))
    };

    // pressure trend (v7 pressTrend)
    let pt = { icon: '—', col: '#5B6B82', label: '표준기압' };
    if (all.length > 1) { const diff = all[0].pressure - all[1].pressure; if (diff > 1.5) pt = { icon: '↑', col: '#13703F', label: '상승' }; else if (diff < -1.5) pt = { icon: '↓', col: '#C2410C', label: '하강' }; }
    if (pt.icon === '—') { if (d.pressure > 1013) pt = { icon: '↑', col: '#13703F', label: '고기압' }; else if (d.pressure < 1013) pt = { icon: '↓', col: '#C2410C', label: '저기압' }; }
    const pc = d.pressure >= 1020 ? '#13703F' : d.pressure >= 1010 ? '#0B1F3A' : d.pressure >= 995 ? '#8A5A00' : '#C2410C';
    const stats = [
      { lbl: 'SWELL', val: String(d.swellH), unit: 'm', col: '#0B1F3A', sub: d.swellPer + 's period' + (d.swellPer >= 10 ? ' — 장주기' : ''), subCol: d.swellPer >= 10 ? '#C2410C' : '#5B6B82', hasCompass: true, deg: (SF.dirToDeg(d.swellD) + 180) % 360, arrow: '#B7791F', badge: (d.swellH > 3 ? 'Rough' : d.swellH > 2 ? 'Moderate' : 'Good') + ' · ' + d.swellD, badgeBg: d.swellH > 2.5 ? '#FFF1E8' : '#E3F6EC', badgeFg: d.swellH > 2.5 ? '#C2410C' : '#13703F', trend: '', trendCol: '#5B6B82', bg: '#FFFFFF', delay: '.05s' },
      { lbl: 'WIND', val: String(d.windKmh), unit: 'km/h', col: '#0B1F3A', sub: 'Gust ' + d.windGust + ' km/h', subCol: '#5B6B82', hasCompass: true, deg: SF.dirToDeg(d.windD), arrow: '#1463FF', badge: (d.windKmh > 50 ? 'Strong' : d.windKmh > 30 ? 'Fresh' : 'Light') + ' · ' + d.windD, badgeBg: d.windKmh > 40 ? '#FFF1E8' : '#E3F6EC', badgeFg: d.windKmh > 40 ? '#C2410C' : '#13703F', trend: '', trendCol: '#5B6B82', bg: '#FFFFFF', delay: '.1s' },
      { lbl: 'SEA TEMP', val: d.sst != null ? String(d.sst) : '—', unit: d.sst != null ? '°C' : '', col: '#0B1F3A', sub: d.sst != null ? 'Open-Meteo SST' : '데이터 없음', subCol: '#5B6B82', hasCompass: false, deg: 0, arrow: '#1463FF', badge: d.sst != null ? 'Live' : 'N/A', badgeBg: d.sst != null ? '#E3F6EC' : '#FFF1E8', badgeFg: d.sst != null ? '#13703F' : '#C2410C', trend: '', trendCol: '#5B6B82', bg: '#FFFFFF', delay: '.15s' },
      { lbl: 'PRESSURE', val: String(d.pressure), unit: 'hPa', col: pc, sub: pt.label, subCol: pt.col, hasCompass: false, deg: 0, arrow: '#1463FF', badge: d.pressure >= 1020 ? 'High' : d.pressure >= 1010 ? 'Normal' : 'Low', badgeBg: '#E7F0FF', badgeFg: '#0B3FA8', trend: pt.icon, trendCol: pt.col, bg: '#FFFFFF', delay: '.2s' }
    ];
    const nowH = now.getHours();
    const hours = d.hours.map(h => { const on = sel === 0 && Math.abs(h.h - nowH) <= 1 && h.h <= nowH; return { t: h.t, sw: h.sw.toFixed ? h.sw.toFixed(1) : h.sw, per: h.per, dir: h.dir, wind: h.wind, wdir: h.wdir, rain: h.rain, bg: on ? '#1463FF' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0B1F3A' }; });
    const ds = all.slice(0, 7), maxSw = Math.max.apply(null, ds.map(x => x.swellH).concat([0.5]));
    const P = ds.map((x, i) => { const X = 10 + i * (300 / Math.max(1, ds.length - 1)), Y = 64 - (x.swellH / maxSw) * 50; return { X, Y, x }; });
    const tpath = P.map((p, j) => (j ? 'L' : 'M') + p.X.toFixed(1) + ',' + p.Y.toFixed(1)).join(' ');
    const trend = { path: tpath, area: P.length ? tpath + ' L' + P[P.length - 1].X.toFixed(1) + ',68 L' + P[0].X.toFixed(1) + ',68 Z' : '', pts: P.map((p, i) => ({ x: p.X.toFixed(1), y: p.Y.toFixed(1), ty: (p.Y - 8).toFixed(1), r: i === sel ? '5' : '3.5', v: p.x.swellH + 'm', d: i === 0 ? '오늘' : p.x.dow, col: i === sel ? '#1463FF' : condOf(p.x).dot })) };
    const sun = { rise: d.sunrise, set: d.sunset, rain: String(d.rain), rainCol: d.rain > 30 ? '#1463FF' : '#0B1F3A' };
    return Object.assign(base, { days, danger, tabs, cond: condOf(d), cur, bars, tide, stats, hours, trend, sun });
  }
}
</script>

<script type="text/plain" id="js-Map">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { layer: 'wind', add: false, gpsErr: '' }; this.map = null; this.layerObj = null; this.markers = []; this.sig = ''; }
  icon(color, w, h) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="' + color + '" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="white" opacity=".9"/></svg>';
    return L.icon({ iconUrl: 'data:image/svg+xml;base64,' + btoa(svg), iconSize: [w || 24, h || 32], iconAnchor: [(w || 24) / 2, h || 32], popupAnchor: [0, -(h || 32) - 2] });
  }
  focus(lat, lng, name) {
    if (!this.map) return;
    this.map.setView([lat, lng], 14);
    const m = L.marker([lat, lng], { icon: this.icon('#F5A623') }).addTo(this.map).bindPopup('<b>' + name + '</b>').openPopup();
    this.markers.push(m);
  }
  setBase() {
    if (!this.map) return;
    if (this.layerObj) this.layerObj.remove();
    const sat = this.state.layer === 'satellite';
    this.layerObj = sat
      ? L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' })
      : L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' });
    this.layerObj.addTo(this.map);
    this.baseKey = this.state.layer === 'satellite';
  }
  drawMarkers() {
    const SF = window.SF, map = this.map;
    this.markers.forEach(m => m.remove()); this.markers = [];
    const loc = SF.activeLoc(), d = SF.today();
    if (d && loc) {
      const arrow = (deg, col, txt, dlat, dlng) => {
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="-18 -18 36 36"><polygon points="0,-14 4,6 0,2 -4,6" fill="' + col + '" stroke="white" stroke-width=".8" transform="rotate(' + deg + ')"/><circle r="3" fill="' + col + '"/></svg>';
        const m = L.marker([loc.lat + dlat, loc.lng + dlng], { icon: L.divIcon({ html: svg, iconSize: [36, 36], iconAnchor: [18, 18], className: '' }), interactive: true }).addTo(map).bindTooltip(txt);
        this.markers.push(m);
      };
      arrow(SF.dirToDeg(d.windD), '#1463FF', '바람 ' + d.windKmh + 'km/h ' + d.windD, 0.008, -0.008);
      arrow(SF.dirToDeg(d.swellD), '#13703F', '스웰 ' + d.swellH + 'm ' + d.swellD, 0.008, 0.008);
    }
    SF.SPOTS.forEach(p => { this.markers.push(L.marker([p[1], p[2]], { icon: this.icon('#F5A623', 18, 24) }).addTo(map).bindPopup('<b>' + p[0] + '</b><br><small>' + p[4] + ' · ' + p[3].map(t => SF.TAG_LABELS[t] || t).join(', ') + '</small>')); });
    SF.pins.forEach(p => { this.markers.push(L.marker([p.lat, p.lng], { icon: this.icon('#0B1F3A', 20, 27) }).addTo(map).bindPopup('<b>' + p.name + '</b><br><small>' + SF.fmtLL(p.lat, p.lng) + '</small>')); });
    SF.locs.forEach((l, i) => {
      const m = L.marker([l.lat, l.lng], { icon: this.icon(i === SF.activeIdx ? '#1463FF' : (l.color || '#1565C0'), 28, 37) }).addTo(map)
        .bindPopup('<b>' + l.name + '</b>' + (l.note ? '<br><small>' + l.note + '</small>' : ''))
        .on('click', () => SF.selectLoc(i));
      this.markers.push(m);
    });
  }
  componentDidRender(host) {
    const SF = window.SF;
    if (typeof L === 'undefined') return;
    const el = host.querySelector('#x3-leaflet-map');
    if (!el) return;
    if (!this.map) {
      const loc = SF.activeLoc() || { lat: -33.95, lng: 151.2 };
      this.map = L.map(el, { center: [loc.lat, loc.lng], zoom: 11, zoomControl: true });
      this.setBase();
      this.map.on('click', e => { if (this.state.add) { const n = prompt('이 낚시자리 이름을 입력해줘:', '낚시자리 ' + (SF.pins.length + 1)); if (n) SF.addPin(n, e.latlng.lat, e.latlng.lng); this.setState({ add: false }); } });
      let lp = null;
      el.addEventListener('touchstart', e => { const t = e.touches[0]; lp = setTimeout(() => { const r = el.getBoundingClientRect(); const ll = this.map.containerPointToLatLng(L.point(t.clientX - r.left, t.clientY - r.top)); const n = prompt('이 낚시자리 이름을 입력해줘:', '낚시자리 ' + (SF.pins.length + 1)); if (n) SF.addPin(n, ll.lat, ll.lng); }, 700); }, { passive: true });
      el.addEventListener('touchend', () => clearTimeout(lp), { passive: true });
      el.addEventListener('touchmove', () => clearTimeout(lp), { passive: true });
      this.lastLoc = SF.activeIdx;
    }
    if (this.baseKey !== (this.state.layer === 'satellite')) this.setBase();
    const loc = SF.activeLoc();
    const sig = JSON.stringify([SF.activeIdx, SF.locs.length, SF.pins.length, SF.marine.status, loc && loc.lat]);
    if (sig !== this.sig) {
      this.sig = sig; this.drawMarkers();
      if (loc && this.lastLoc !== SF.activeIdx) { this.map.setView([loc.lat, loc.lng], 11); this.lastLoc = SF.activeIdx; }
    }
  }
  onShow() { if (this.map) this.map.invalidateSize(); }
  renderVals() {
    const SF = window.SF, s = this.state, L0 = SF.activeLoc(), d = SF.today();
    const favs = SF.locs.map((l, i) => ({ name: l.name, color: l.color || '#1565C0', dist: SF.distStr(l.lat, l.lng) || (l.lat.toFixed(3) + ', ' + l.lng.toFixed(3)), on: i === SF.activeIdx ? 'true' : 'false', bg: i === SF.activeIdx ? '#1463FF' : '#FFFFFF', fg: i === SF.activeIdx ? '#FFFFFF' : '#0B1F3A', pick: () => SF.selectLoc(i) }));
    const swCol = !d ? '#0B1F3A' : d.swellH <= 1.0 ? '#13703F' : d.swellH <= 2.0 ? '#0B3FA8' : '#C2410C';
    const t0 = d && d.tides[0];
    const live = d ? [{ val: d.swellH + 'm', lbl: 'Swell ' + d.swellPer + 's', col: swCol }, { val: String(d.windKmh), lbl: 'Wind ' + d.windD, col: '#0B1F3A' }, { val: d.sst != null ? d.sst + '°' : '—', lbl: 'SST', col: '#0B1F3A' }, { val: String(d.pressure), lbl: 'hPa', col: '#0B1F3A' }, { val: t0 ? SF.f2(t0.h, t0.m) : '—', lbl: t0 ? (t0.type === 'high' ? '↑ ' : '↓ ') + t0.height + 'm' : 'Tide', col: '#0B1F3A' }] : [];
    const layers = [['wind', 'Wind'], ['swell', 'Swell'], ['temp', 'SST'], ['satellite', 'Satellite']].map(l => ({ label: l[1], on: s.layer === l[0] ? 'true' : 'false', bg: s.layer === l[0] ? '#0B1F3A' : '#FFFFFF', fg: s.layer === l[0] ? '#FFFFFF' : '#0B1F3A', pick: () => this.setState({ layer: l[0] }) }));
    let card = { hasFc: false, golden: [], tags: [] };
    if (L0) {
      card = { name: L0.name, coords: SF.fmtLL(L0.lat, L0.lng), hasNote: !!L0.note, note: L0.note || '', tags: (L0.tags || []).map(t => SF.TAG_LABELS[t] || t), hasFc: !!d, golden: [] };
      if (d) {
        const sw = d.swellH, wi = d.windKmh, rain = d.rain || 0;
        let fc;
        if (sw <= 1.0 && wi <= 15 && rain < 20) fc = { t: '출조 강추', m: '스웰 ' + sw + 'm · 바람 ' + wi + 'km/h — 최상의 조건. 지금 나가!', dot: '#13703F', bg: '#E3F6EC', fg: '#13703F' };
        else if (sw <= 1.5 && wi <= 25 && rain < 40) fc = { t: '출조 가능', m: '스웰 ' + sw + 'm · 바람 ' + wi + 'km/h — 무난한 조건.' + (sw > 1.2 ? ' 파도 주의.' : ''), dot: '#1463FF', bg: '#E7F0FF', fg: '#0B3FA8' };
        else if (sw <= 2.5) fc = { t: '조건 보통', m: '스웰 ' + sw + 'm — 만 안쪽 포인트 추천. 외해는 자제.', dot: '#B7791F', bg: '#FFF7E0', fg: '#8A5A00' };
        else fc = { t: '출조 비추천', m: '스웰 ' + sw + 'm · 파도 강함 — 안전 최우선. 다음 기회 노려.', dot: '#C2410C', bg: '#FFF1E8', fg: '#C2410C' };
        const tm = x => { const [h, m] = x.split(':').map(Number); return h * 60 + m; }, f = m => SF.f2(Math.floor(m / 60), m % 60);
        const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
        card.fcTitle = fc.t; card.fcMsg = fc.m; card.fcDot = fc.dot; card.fcBg = fc.bg; card.fcFg = fc.fg;
        card.golden = [['일출 골든타임', tm(d.sunrise)], ['일몰 골든타임', tm(d.sunset)]].map(g => { const on = nm >= g[1] - 45 && nm <= g[1] + 45; return { lbl: g[0], range: f(g[1] - 45) + ' ~ ' + f(g[1] + 45), now: on, bg: on ? '#1463FF' : '#F3F7FC', fg: on ? '#FFFFFF' : '#0B1F3A' }; });
      }
    }
    const pins = SF.pins.map((p, i) => ({ name: p.name, coords: SF.fmtLL(p.lat, p.lng), del: () => SF.deletePin(i), focus: () => { if (this.map) this.map.setView([p.lat, p.lng], 15); } }));
    let recs = [];
    if (SF.gps) recs = SF.SPOTS.map(p => ({ p, dist: SF.hav(SF.gps.lat, SF.gps.lng, p[1], p[2]) })).filter(x => x.dist <= 150).sort((a, b) => a.dist - b.dist).slice(0, 10).map((x, i) => ({ name: x.p[0], dist: x.dist.toFixed(1) + ' km', type: x.p[4], species: x.p[3].map(t => SF.TAG_LABELS[t] || t).join(' · '), delay: (0.05 * i).toFixed(2) + 's', focus: () => this.focus(x.p[1], x.p[2], x.p[0]) }));
    const wl = L0 || { lat: -33.95, lng: 151.2 };
    return {
      favs, notice: SF.notice(), hasLive: live.length > 0, live, layers, hasCard: !!L0, card, pins, noPins: pins.length === 0, recs,
      noGps: !SF.gps, hasGps: !!SF.gps, gpsErr: s.gpsErr, gps: () => SF.requestGPS((g, err) => { if (!g) this.setState({ gpsErr: err }); }),
      addMode: s.add, addOn: s.add ? 'true' : 'false', addBg: s.add ? '#0B1F3A' : '#E7F0FF', addFg: s.add ? '#FFFFFF' : '#1463FF', addLabel: s.add ? '추가 취소' : '+ 핀 추가', toggleAdd: () => this.setState({ add: !s.add }),
      windyUrl: 'https://www.windy.com/' + (s.layer === 'satellite' ? 'wind' : s.layer) + '/' + wl.lat.toFixed(3) + '/' + wl.lng.toFixed(3) + '?' + (s.layer === 'satellite' ? 'wind' : s.layer) + ',' + wl.lat.toFixed(3) + ',' + wl.lng.toFixed(3) + ',10'
    };
  }
}
</script>

<script type="text/plain" id="js-Location">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.blank = { edit: -1, q: '', name: '', note: '', lat: null, lng: null, latStr: '', lngStr: '', selName: '', color: '#1565C0', tags: [], picker: false, direct: false, error: '', results: [], searching: false };
    this.state = Object.assign({ ok: '' }, this.blank);
    this.pmap = null; this.pmark = null; this.timer = null;
  }
  search(q) {
    clearTimeout(this.timer);
    if (!q || q.trim().length < 2) { this.setState({ results: [], searching: false }); return; }
    this.setState({ searching: true });
    this.timer = setTimeout(async () => {
      const SF = window.SF, ql = q.trim().toLowerCase();
      // NSW 추천 명당 먼저 + Nominatim (v7 동일)
      const local = SF.SPOTS.filter(p => p[0].toLowerCase().includes(ql)).slice(0, 3).map(p => ({ name: p[0], sub: 'NSW 추천 명당 · ' + p[4], lat: p[1], lng: p[2] }));
      let remote = [];
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=6&countrycodes=au');
        const data = await r.json();
        remote = (data || []).map(d => { const parts = d.display_name.split(','); return { name: parts[0].trim(), sub: parts.slice(1, 3).join(',').trim(), lat: parseFloat(d.lat), lng: parseFloat(d.lon) }; });
      } catch (e) { remote = []; }
      if (this.state.q.trim().toLowerCase() !== ql) return;
      this.setState({ results: local.concat(remote), searching: false });
    }, 500);
  }
  setSel(lat, lng, selName, extra) {
    lat = +(+lat).toFixed(5); lng = +(+lng).toFixed(5);
    this.setState(Object.assign({ lat, lng, latStr: String(lat), lngStr: String(lng), selName, error: '' }, extra || {}));
    if (this.pmap) { this.placePin(lat, lng); this.pmap.setView([lat, lng], Math.max(this.pmap.getZoom(), 12)); }
  }
  placePin(lat, lng) {
    if (!this.pmap) return;
    if (this.pmark) this.pmark.remove();
    const c = this.state.color;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="' + c + '" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="white"/></svg>';
    this.pmark = L.marker([lat, lng], { icon: L.icon({ iconUrl: 'data:image/svg+xml;base64,' + btoa(svg), iconSize: [28, 37], iconAnchor: [14, 37] }) }).addTo(this.pmap);
  }
  componentDidRender(host) {
    if (typeof L === 'undefined') return;

    const SF = window.SF, c = this.state.lat != null ? { lat: this.state.lat, lng: this.state.lng } : (SF.activeLoc() || { lat: -33.95, lng: 151.2 });
    this.pmap = L.map(el, { center: [c.lat, c.lng], zoom: 11 });
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' }).addTo(this.pmap);
    this.pmap.on('click', e => this.setSel(e.latlng.lat, e.latlng.lng, '지도에서 선택됨'));
    if (this.state.lat != null) this.placePin(this.state.lat, this.state.lng);
